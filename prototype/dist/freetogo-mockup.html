:root {
  /* Brand */
  --berry-800: #861238;
  --berry-700: #9E1645;   /* pressed / text on berry-100 */
  --berry-600: #C21E56;   /* primary: lingonberry — 5.8:1 on white */
  --berry-100: #FDE8EF;
  --berry-50:  #FFF5F8;

  --ink-900: #241A3A;     /* blueberry ink: primary text — 15:1 on bg */
  --ink-700: #463C5C;
  --ink-500: #6B6280;     /* secondary text — 5.7:1 on white */
  --ink-300: #B9B3C6;
  --ink-200: #DEDAE6;
  --ink-100: #EEEBF3;

  --saffron-500: #FFB020; /* walk-in / uncertain — ink text 8.9:1 */
  --saffron-400: #FFC550;
  --saffron-100: #FFF1D6;
  --saffron-800: #7A4B00;

  --success-700: #1E7A4C;
  --success-100: #E3F4EA;
  --danger-700:  #B42318;
  --danger-100:  #FDECEA;

  --bg: #F6F4F8;          /* faint heather, not cream */
  --surface: #FFFFFF;
  --scrim: rgba(36, 26, 58, .48);

  /* Type */
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-ui: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-xs: 12px;  --lh-xs: 16px;
  --fs-sm: 14px;  --lh-sm: 20px;
  --fs-md: 16px;  --lh-md: 24px;
  --fs-lg: 18px;  --lh-lg: 26px;
  --fs-xl: 22px;  --lh-xl: 28px;
  --fs-2xl: 28px; --lh-2xl: 32px;
  --fs-3xl: 34px; --lh-3xl: 38px;

  /* Spacing (4pt grid) */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;

  /* Radii — hierarchy, not one radius for everything */
  --r-sm: 8px;     /* photo labels, small tags */
  --r-md: 14px;    /* buttons, inputs */
  --r-lg: 20px;    /* cards */
  --r-xl: 28px;    /* sheets, phone screens */
  --r-pill: 999px; /* chips */

  /* Sizes */
  --tap: 48px;           /* minimum touch target (≥44 required) */
  --btn-h: 52px;
  --tabbar-h: 64px;
  --card-photo-h: 132px;

  --shadow-card: 0 1px 2px rgba(36,26,58,.06), 0 4px 14px rgba(36,26,58,.06);
  --shadow-float: 0 10px 30px rgba(36,26,58,.18);

  /* The signature pattern: hatched saffron = "no reservation, availability uncertain" */
  --hatch: repeating-linear-gradient(135deg, var(--saffron-500) 0 9px, var(--saffron-400) 9px 18px);
}

</style>
  <style>
/* Free To Go — prototype styles. Component classes mirror future native components. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-ui); font-size: var(--fs-md); line-height: var(--lh-md);
  color: var(--ink-900); background: #E9E5EF;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--berry-600); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Stage: demo panel + device frame ---------- */
.stage { min-height: 100%; display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 28px 20px; }
.device { flex: none; width: calc(var(--device-w, 390px) + 24px); padding: 12px; border-radius: 52px; background: #1d1529; box-shadow: 0 30px 60px rgba(36,26,58,.28); position: sticky; top: 20px; }
.screen { position: relative; width: var(--device-w, 390px); height: min(844px, calc(100vh - 80px)); min-height: 640px; border-radius: 40px; overflow: hidden; background: var(--bg); isolation: isolate; }
.statusbar { position: absolute; inset: 0 0 auto 0; height: 44px; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-weight: 700; font-size: 15px; pointer-events: none; }
.statusbar .notch { width: 110px; height: 30px; background: #1d1529; border-radius: 0 0 18px 18px; position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
.statusbar.on-dark { color: #fff; }

/* Narrow real phones: app fills the viewport, demo panel becomes an overlay */
@media (max-width: 560px) {
  body { background: var(--bg); }
  .stage { padding: 0; display: block; }
  .device { width: 100%; padding: 0; border-radius: 0; box-shadow: none; position: static; background: none; }
  .screen { width: 100%; height: 100dvh; min-height: 0; border-radius: 0; }
  .statusbar { display: none; }
  .app { --safe-top: 8px !important; }
  .demo { display: none; position: fixed; inset: 0; z-index: 100; max-width: none !important; overflow: auto; border-radius: 0 !important; }
  .demo.open { display: block; }
  .demo-fab { display: flex !important; }
}

/* ---------- Demo panel ---------- */
.demo { width: 360px; max-width: 360px; background: #fff; border-radius: 24px; padding: 22px; box-shadow: var(--shadow-card); font-size: var(--fs-sm); line-height: var(--lh-sm); }
.demo h1 { font-family: var(--font-display); font-size: 24px; line-height: 28px; margin: 0 0 4px; letter-spacing: -.01em; }
.demo h2 { font-size: 15px; margin: 22px 0 8px; }
.demo p { margin: 0 0 8px; color: var(--ink-500); }
.demo .notice { background: var(--saffron-100); color: var(--saffron-800); border-radius: 12px; padding: 10px 12px; margin: 12px 0; }
.demo .row { display: flex; flex-wrap: wrap; gap: 6px; }
.demo button.d { border: 1px solid var(--ink-200); background: #fff; border-radius: 10px; padding: 8px 10px; min-height: 36px; text-align: left; font-size: 13px; line-height: 18px; }
.demo button.d:hover { border-color: var(--berry-600); }
.demo button.d.on { background: var(--ink-900); color: #fff; border-color: var(--ink-900); }
.demo .scen { display: grid; gap: 6px; }
.demo .scen button.d { width: 100%; padding: 10px 12px; }
.demo .scen button.d b { display: block; font-size: 14px; }
.demo .steps { margin: 8px 0 0; padding: 12px 12px 12px 30px; background: var(--bg); border-radius: 12px; }
.demo .steps li { margin: 2px 0; }
.demo .steps li.done { color: var(--ink-300); text-decoration: line-through; }
.demo .log { max-height: 200px; overflow: auto; background: var(--ink-900); color: #EDE9F5; border-radius: 12px; padding: 10px 12px; font-size: 12px; line-height: 17px; }
.demo .log div + div { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.12); }
.demo .log:empty::after { content: attr(data-empty); color: #9C94AE; }
.demo-close { display: none; }
@media (max-width: 560px) { .demo-close { display: inline-flex; float: right; } }
.demo-fab { display: none; position: fixed; right: 12px; bottom: calc(var(--tabbar-h) + 18px); z-index: 90; background: var(--ink-900); color: #fff; border: 0; border-radius: 999px; height: 40px; padding: 0 14px; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; box-shadow: var(--shadow-float); }

/* ---------- App shell ---------- */
.app { --safe-top: 48px; position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-top: var(--safe-top); scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.pad { padding: 0 var(--s-4); }
.view-pad { padding: var(--s-2) var(--s-4) var(--s-8); }

.tabbar { flex: none; height: calc(var(--tabbar-h) + 14px); padding-bottom: 14px; background: var(--surface); border-top: 1px solid var(--ink-100); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; z-index: 5; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink-500); min-height: var(--tap); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--berry-600); }
.tab .dot { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--berry-600); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

/* ---------- Typography ---------- */
.h-display { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-3xl); line-height: var(--lh-3xl); letter-spacing: -.02em; margin: 0; }
.h1 { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-2xl); line-height: var(--lh-2xl); letter-spacing: -.015em; margin: 0; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xl); line-height: var(--lh-xl); letter-spacing: -.01em; margin: 0; }
.h3 { font-weight: 700; font-size: var(--fs-lg); line-height: var(--lh-lg); margin: 0; }
.muted { color: var(--ink-500); }
.small { font-size: var(--fs-sm); line-height: var(--lh-sm); }
.xs { font-size: var(--fs-xs); line-height: var(--lh-xs); }
.bold { font-weight: 700; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: var(--s-6) 0 var(--s-3); }
.section-title .h3 { font-size: var(--fs-lg); }
p { margin: 0 0 var(--s-2); }

/* ---------- Header (discover) ---------- */
.topbar { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-4) 0; }
.loc-chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 6px 0 0; border: 0; background: none; text-align: left; flex: 1; min-width: 0; }
.loc-chip .t { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-xl); line-height: var(--lh-xl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.loc-chip .sub { display: block; font-size: var(--fs-xs); color: var(--ink-500); font-weight: 600; line-height: 14px; }
.loc-chip svg { flex: none; }
.role-pill { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--ink-200); background: var(--surface); font-weight: 700; font-size: 13px; }
.role-pill.merchant { background: var(--ink-900); border-color: var(--ink-900); color: #fff; }

.searchrow { display: flex; gap: var(--s-2); padding: var(--s-3) var(--s-4) 0; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; height: var(--tap); padding: 0 14px; background: var(--surface); border-radius: var(--r-md); border: 1px solid var(--ink-100); min-width: 0; }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; }
.icon-btn { flex: none; width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; border-radius: var(--r-md); border: 1px solid var(--ink-100); background: var(--surface); position: relative; }
.icon-btn .badge-n { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 8px; background: var(--berry-600); color: #fff; font-size: 10px; line-height: 16px; font-weight: 700; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--ink-100); border-radius: var(--r-md); padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; height: 40px; border-radius: 11px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--ink-900); box-shadow: 0 1px 3px rgba(36,26,58,.12); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: var(--s-3) var(--s-4) 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--ink-200); background: var(--surface); font-weight: 600; font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip.on { background: var(--ink-900); color: #fff; border-color: var(--ink-900); }
.chip .sw { width: 14px; height: 14px; border-radius: 4px; }

/* ---------- Banner (demo data) ---------- */
.mockbar { margin: var(--s-3) var(--s-4) 0; display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-500); background: var(--surface); border: 1px dashed var(--ink-300); border-radius: 12px; padding: 8px 10px; }

/* ---------- Offer card ---------- */
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-4); }
.cards > * { min-width: 0; }
.card { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-card); border: 0; padding: 0; text-align: left; width: 100%; display: block; position: relative; }
.card.dim { opacity: .62; }
.card-photo { position: relative; height: var(--card-photo-h); background: var(--ink-100); overflow: hidden; }
.card-photo svg.art, .hero svg.art { width: 100%; height: 100%; display: block; }
.card-photo .tl { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; right: 60px; }
.card-photo .photo-tag-wrap { position: absolute; left: 10px; bottom: 10px; }
.card-fav { position: absolute; right: 8px; top: 8px; z-index: 2; }
.card-body { padding: 12px var(--s-4) var(--s-4); }
.name-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.name-row .grow { min-width: 0; flex: 1; }
.card-body .name { font-weight: 700; font-size: var(--fs-lg); line-height: 22px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-body .what { color: var(--ink-500); font-size: var(--fs-sm); line-height: 18px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar.sm { width: 36px; height: 36px; border-radius: 11px; font-size: 13px; border-width: 0; box-shadow: none; flex: none; }
.card-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-meta .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--fs-sm); color: var(--ink-700); }
.card-meta .facts span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.walkin-strip { height: 30px; background: var(--hatch); display: flex; align-items: center; padding: 0 12px; font-weight: 700; font-size: 13px; color: var(--ink-900); gap: 6px; }
.walkin-strip span { background: var(--saffron-500); padding: 2px 6px; border-radius: 6px; }

.zero { flex: none; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1; color: var(--berry-600); white-space: nowrap; }
.zero small { font-family: var(--font-ui); font-size: 11px; font-weight: 700; color: var(--ink-500); display: block; text-align: right; margin-top: 3px; }

/* compact card for horizontal rails */
.rail { display: flex; gap: 12px; overflow-x: auto; padding: 2px var(--s-4) 6px; margin: 0 calc(var(--s-4) * -1); scrollbar-width: none; scroll-snap-type: x mandatory; }
.rail::-webkit-scrollbar { display: none; }
.rail .card { flex: none; width: 272px; scroll-snap-align: start; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: var(--r-sm); font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap; }
.badge svg { width: 14px; height: 14px; }
.badge.reserve { background: var(--berry-600); color: #fff; }
.badge.walkin { background: var(--hatch); color: var(--ink-900); }
.badge.soldout { background: var(--ink-900); color: #fff; }
.badge.ended { background: var(--ink-200); color: var(--ink-700); }
.badge.ok { background: var(--success-100); color: var(--success-700); }
.badge.warn { background: var(--saffron-100); color: var(--saffron-800); }
.badge.danger { background: var(--danger-100); color: var(--danger-700); }
.badge.light { background: rgba(255,255,255,.94); color: var(--ink-900); }
.badge.outline { background: var(--surface); border: 1px solid var(--ink-200); color: var(--ink-700); }

.avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 15px; border: 3px solid var(--surface); box-shadow: 0 1px 3px rgba(36,26,58,.18); }
.avatar.lg { width: 56px; height: 56px; border-radius: 16px; font-size: 20px; }

/* ---------- Heart & Bell ---------- */
.round { width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255,255,255,.95); color: var(--ink-900); box-shadow: 0 1px 4px rgba(36,26,58,.16); }
.round svg { width: 22px; height: 22px; }
.round.heart.on { color: var(--berry-600); }
.round.bell.on { background: var(--ink-900); color: var(--saffron-500); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle-card { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 10px 12px; border-radius: var(--r-md); border: 1.5px solid var(--ink-200); background: var(--surface); text-align: left; font-weight: 700; font-size: var(--fs-sm); line-height: 18px; }
.toggle-card svg { width: 24px; height: 24px; flex: none; }
.toggle-card .sub { display: block; font-weight: 500; color: var(--ink-500); font-size: 12px; line-height: 16px; }
.toggle-card.heart.on { border-color: var(--berry-600); background: var(--berry-50); color: var(--berry-700); }
.toggle-card.bell.on { border-color: var(--ink-900); background: var(--ink-900); color: #fff; }
.toggle-card.bell.on svg { color: var(--saffron-500); }
.toggle-card.bell.on .sub { color: #CFC8DD; }

/* ---------- Buttons ---------- */
.btn { min-height: var(--btn-h); padding: 0 20px; border-radius: var(--r-md); border: 0; font-weight: 700; font-size: var(--fs-md); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; line-height: 20px; }
.btn.block { width: 100%; }
.btn.primary { background: var(--berry-600); color: #fff; }
.btn.primary:active { background: var(--berry-700); }
.btn.dark { background: var(--ink-900); color: #fff; }
.btn.saffron { background: var(--saffron-500); color: var(--ink-900); }
.btn.secondary { background: var(--surface); color: var(--ink-900); border: 1.5px solid var(--ink-200); }
.btn.ghost { background: none; color: var(--berry-700); min-height: var(--tap); padding: 0 8px; }
.btn.danger { background: var(--surface); color: var(--danger-700); border: 1.5px solid #F2C4BF; }
.btn.danger-solid { background: var(--danger-700); color: #fff; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: var(--fs-sm); border-radius: 12px; }
.btn[disabled], .btn.is-disabled { background: var(--ink-100); color: var(--ink-500); border-color: var(--ink-100); cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; }
.disabled-why { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; font-size: var(--fs-sm); line-height: 20px; color: var(--ink-700); }
.disabled-why svg { flex: none; margin-top: 2px; }
.demo-act { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--ink-300); background: var(--surface); color: var(--ink-700); border-radius: 12px; min-height: 40px; padding: 0 12px; font-size: 13px; font-weight: 600; }
.demo-act b { background: var(--ink-100); color: var(--ink-700); font-size: 11px; border-radius: 6px; padding: 1px 6px; }

/* ---------- Detail (hero + sticky CTA) ---------- */
.detail { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 10; animation: push .22s ease-out; }
@keyframes push { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.detail .scroll { padding-top: 0; }
.hero { position: relative; height: 248px; background: var(--ink-100); }
.hero-actions { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) - 4px); display: flex; justify-content: space-between; padding: 0 var(--s-4); }
.hero-actions .r { display: flex; gap: 8px; }
.hero .photo-tag { position: absolute; left: 16px; bottom: 16px; }
.sheet-card { position: relative; background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; margin-top: -24px; padding: var(--s-5) var(--s-4) var(--s-4); }
.navbar { display: flex; align-items: center; gap: 8px; padding: var(--s-2) var(--s-2) var(--s-2) var(--s-2); }
.navbar .title { font-weight: 700; font-size: var(--fs-lg); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; }
.back.float { background: rgba(255,255,255,.95); box-shadow: 0 1px 4px rgba(36,26,58,.16); }
.cta-bar { flex: none; background: var(--surface); border-top: 1px solid var(--ink-100); padding: 12px var(--s-4) 26px; }
.cta-bar .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-size: var(--fs-sm); }

.block { background: var(--surface); border-radius: var(--r-lg); padding: var(--s-4); margin-top: var(--s-3); }
.block.flat { box-shadow: none; }
.block h3 { margin: 0 0 var(--s-2); font-size: var(--fs-md); font-weight: 700; }
.info-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
.info-row + .info-row { border-top: 1px solid var(--ink-100); }
.info-row .ic { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--ink-100); display: grid; place-items: center; color: var(--ink-700); }
.info-row .ic svg { width: 20px; height: 20px; }
.info-row .t { font-weight: 700; }
.info-row .s { color: var(--ink-500); font-size: var(--fs-sm); line-height: 20px; }

.mode-panel { border-radius: var(--r-lg); padding: var(--s-4); margin-top: var(--s-3); display: flex; gap: 12px; }
.mode-panel.reserve { background: var(--berry-50); border: 1.5px solid #F7C9D8; }
.mode-panel.walkin { background: var(--saffron-100); border: 0; padding: 0; overflow: hidden; display: block; }
.mode-panel.walkin .hatch-head { background: var(--hatch); padding: 12px var(--s-4); font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 24px; color: var(--ink-900); }
.mode-panel.walkin .inner { padding: 12px var(--s-4) var(--s-4); color: var(--ink-900); font-size: var(--fs-sm); line-height: 20px; }
.mode-panel .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--berry-600); color: #fff; display: grid; place-items: center; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r-pill); background: var(--ink-100); font-size: var(--fs-sm); font-weight: 600; line-height: 18px; }
.caveat { margin-top: 10px; font-size: var(--fs-sm); line-height: 20px; color: var(--ink-700); background: var(--bg); border-radius: 12px; padding: 10px 12px; }

/* ratings */
.score-head { display: flex; align-items: center; gap: 12px; }
.score-big { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; }
.factor { display: grid; grid-template-columns: 1fr 96px 30px; align-items: center; gap: 10px; padding: 7px 0; font-size: var(--fs-sm); }
.bar { height: 8px; border-radius: 4px; background: var(--ink-100); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--berry-600); border-radius: 4px; }
.reliab { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--success-100); color: var(--success-700); font-size: var(--fs-sm); line-height: 20px; margin-top: 12px; }
.reliab b { font-family: var(--font-display); font-size: 22px; }
.stars { display: inline-flex; gap: 2px; color: var(--saffron-500); }
.stars svg { width: 16px; height: 16px; }
.star-input { display: flex; gap: 4px; }
.star-input button { width: 44px; height: 44px; border: 0; background: none; padding: 0; color: var(--ink-200); display: grid; place-items: center; }
.star-input button.on { color: var(--saffron-500); }
.star-input button svg { width: 32px; height: 32px; }
.rate-row { padding: 12px 0; }
.rate-row + .rate-row { border-top: 1px solid var(--ink-100); }

/* walk-in report */
.report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.report-btn { min-height: 104px; border-radius: 18px; border: 2px solid var(--ink-200); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 14px; line-height: 18px; padding: 8px 4px; text-align: center; }
.report-btn svg { width: 40px; height: 32px; }
.report-btn.on { border-color: var(--ink-900); background: var(--ink-900); color: #fff; }
.report-list { margin-top: 12px; display: grid; gap: 8px; }

  <script>
/* Free To Go — reusable UI components (pure functions: props -> HTML string).
   Each maps to a future React Native component; see docs/design/NATIVE_MAPPING.md. */
(function () {
  const t = FTG.t, icon = FTG.icon;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (m) => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const parseT = (s) => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
  const km = (d) => FTG.lang ? d.toFixed(1) : d.toFixed(1).replace('.', ',');
  const num1 = (v) => FTG.lang ? v.toFixed(1) : v.toFixed(1).replace('.', ',');
  const C = { esc, fmt, parseT, km, num1 };

  C.ago = (at, now) => { const d = Math.max(0, now - at); if (d < 1) return t('ago_now'); if (d < 60) return t('ago_min', { n: d }); return t('ago_h', { n: Math.floor(d / 60) }); };

  // AvailabilityBadge + DistributionMode badge
  C.modeBadge = (o) => o.distributionMode === 'WALK_IN'
    ? `<span class="badge walkin">${icon('alert')}${t('walkin_badge')}</span>`
    : `<span class="badge reserve">${icon('bag')}${t('reserve_badge')}</span>`;

  C.statusBadge = (o, st) => {
    switch (st) {
      case 'soldout': case 'stopped': return `<span class="badge soldout">${t('soldout_badge')}</span>`;
      case 'ended': return `<span class="badge ended">${t('expired_badge')}</span>`;
      case 'expired': return `<span class="badge ended">${t('expired_t')}</span>`;
      case 'closed': return `<span class="badge ended">${t('closed_badge')}</span>`;
      case 'possiblyGone': return `<span class="badge danger">${t('possibly_gone_badge')}</span>`;
      case 'review': return `<span class="badge danger">${t('review_badge')}</span>`;
      default:
        if (o.distributionMode === 'RESERVED') return `<span class="badge light">${t('left_n', { n: o.qtyLeft })}</span>`;
        return '';
    }
  };

  C.photoTag = (o) => {
    if (!o.photo || o.photo.kind === 'none') return '';
    if (o.photo.kind === 'example') return `<span class="photo-tag example">${icon('info')}${t('photo_example')}</span>`;
    return `<span class="photo-tag">${icon('camera')}${t('photo_today', { t: fmt(o.photo.at) })}</span>`;
  };

  C.photo = (o, store) => {
    if (o.photo && o.photo.kind !== 'none') return FTG.art(o.photo.art, o.id);
    // No photo: calm branded placeholder with store initials, never pretending to be food.
    return `<svg class="art" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="250" fill="${store.color}"/><text x="200" y="150" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="84" fill="rgba(255,255,255,.18)">${esc(store.initials)}</text></svg>`;
  };

  C.avatar = (store, cls = '') => `<span class="avatar ${cls}" style="background:${store.color}" aria-hidden="true">${esc(store.initials)}</span>`;

  C.stars = (v) => { let s = '<span class="stars" aria-hidden="true">'; for (let i = 1; i <= 5; i++) s += `<span style="opacity:${v >= i - .25 ? 1 : .25}">${icon('star')}</span>`; return s + '</span>'; };

  C.overall = (r) => r.n ? (r.quality + r.quantity + r.variety + r.smoothness) / 4 : 0;

  // FavoriteHeart / ShopBell (distinct controls)
  C.heart = (storeId, on, cls = 'round') => `<button class="${cls} heart ${on ? 'on' : ''}" data-action="toggleFav" data-arg="${storeId}" aria-pressed="${on}" aria-label="${t('heart_label')}">${icon(on ? 'heartFill' : 'heart')}</button>`;
  C.bell = (storeId, on, cls = 'round') => `<button class="${cls} bell ${on ? 'on' : ''}" data-action="toggleBell" data-arg="${storeId}" aria-pressed="${on}" aria-label="${t('bell_label')}">${icon(on ? 'bellFill' : 'bell')}</button>`;
  C.heartCard = (storeId, on) => `<button class="toggle-card heart ${on ? 'on' : ''}" data-action="toggleFav" data-arg="${storeId}" aria-pressed="${on}">${icon(on ? 'heartFill' : 'heart')}<span>${t('heart_label')}<span class="sub">${on ? t('heart_on_s') : t('heart_off_s')}</span></span></button>`;
  C.bellCard = (storeId, on) => `<button class="toggle-card bell ${on ? 'on' : ''}" data-action="toggleBell" data-arg="${storeId}" aria-pressed="${on}">${icon(on ? 'bellFill' : 'bell')}<span>${t('bell_label')}<span class="sub">${on ? t('bell_on_s') : t('bell_off_s')}</span></span></button>`;

  C.contentLine = (o) => o.distributionMode === 'WALK_IN' && o.what ? o.what : o.categories.map(FTG.cat).join(', ');

  // OfferCard
  C.offerCard = (o, store, st, ctx) => {
    const dim = ['soldout', 'stopped', 'ended', 'expired', 'closed'].includes(st);
    const r = store.ratings;
    const walk = o.distributionMode === 'WALK_IN';
    let strip = '';
    if (walk) {
      const last = ctx.lastReport;
      strip = `<div class="walkin-strip"><span>${t('walkin_label')}</span></div>`;
      if (last) strip += `<div class="xs" style="padding:8px 16px 0;color:var(--ink-700)"><span class="lvl ${last.lvl}" style="display:inline-block;margin-right:6px"></span>${t('latest_report', { r: t('r_' + last.lvl), a: C.ago(last.at, ctx.now) })}</div>`;
    }
    const time = t('pickup_window', { s: fmt(o.start), e: fmt(o.end) });
    return `<article class="card ${dim ? 'dim' : ''}" data-action="openOffer" data-arg="${o.id}" role="link" tabindex="0" aria-label="${esc(store.name)}">
      <div class="card-photo">${C.photo(o, store)}
        <div class="tl">${C.modeBadge(o)}${C.statusBadge(o, st)}</div>
        <div class="card-fav">${C.heart(store.id, ctx.fav)}</div>
        <span class="photo-tag-wrap">${C.photoTag(o)}</span>
      </div>
      ${strip}
      <div class="card-body">
        <div class="name-row">${C.avatar(store, 'sm')}<div class="grow"><p class="name">${esc(store.name)}</p><p class="what">${esc(C.contentLine(o))}</p></div></div>
        <div class="card-meta">
          <div class="facts">
            <span>${icon('clock')}${time}</span>
            <span>${icon('pin')}${t('km', { d: km(store.km) })}</span>
            ${r.n ? `<span style="color:var(--ink-900)">${icon('star').replace('<svg', '<svg style="width:16px;height:16px;color:var(--saffron-500)"')} ${num1(C.overall(r))} <span class="muted">(${r.n})</span></span>` : ''}
          </div>
          <div class="zero">${t('free')}</div>
        </div>
      </div>
    </article>`;
  };

  C.categoryTags = (cats) => `<div class="tags">${cats.map(c => `<span class="tag">${esc(FTG.cat(c))}</span>`).join('')}</div>`;

  // RatingFactors (+ separate reliability)
  C.ratingBlock = (store) => {
    const r = store.ratings;
    let html = `<div class="block"><h3>${t('ratings_title')}</h3>`;
    if (!r.n) html += `<p class="muted small">${t('ratings_none')}</p>`;
    else {
      html += `<div class="score-head"><span class="score-big">${num1(C.overall(r))}</span><div>${C.stars(C.overall(r))}<div class="muted small">${t('ratings_based', { n: r.n })}</div></div></div><div class="mt-3">`;
      [['f_quality', r.quality], ['f_quantity', r.quantity], ['f_variety', r.variety], ['f_smoothness', r.smoothness]].forEach(([k, v]) => {
        html += `<div class="factor"><span>${t(k)}</span><span class="bar"><i style="width:${(v / 5) * 100}%"></i></span><b>${num1(v)}</b></div>`;
      });
      html += `</div>`;
    }
    const rel = store.rel;
    if (rel.ok + rel.fail > 0) {
      const pct = Math.round((rel.ok / (rel.ok + rel.fail)) * 100);
      html += `<div class="reliab">${icon('shield')}<div><b>${pct} %</b> <span class="bold">${t('reliability')}</span><div>${t('reliability_s', { ok: rel.ok, f: rel.fail })}</div></div></div>`;
    }
    return html + `</div>`;
  };

  C.starInput = (action, arg, val, label) => {
    let s = `<div class="star-input" role="radiogroup" aria-label="${esc(label)}">`;
    for (let i = 1; i <= 5; i++) s += `<button class="${val >= i ? 'on' : ''}" data-action="${action}" data-arg="${arg}:${i}" role="radio" aria-checked="${val === i}" aria-label="${i}/5">${icon('star')}</button>`;
    return s + '</div>';
  };

  C.switchRow = (action, on, title, sub, arg = '') => `<div class="switch-row"><div class="grow"><span class="t">${title}</span>${sub ? `<span class="s">${sub}</span>` : ''}</div><button class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}" aria-label="${esc(title)}" data-action="${action}" data-arg="${arg}"></button></div>`;

  C.empty = ({ title, body, actions = '', art = true }) => `<div class="empty">${art ? FTG.emptyArt() : ''}<h2 class="h2">${title}</h2><p>${body}</p>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;

  C.actionCard = (action, arg, ic, tone, title, sub) => `<button class="action-card" data-action="${action}" data-arg="${arg || ''}"><span class="ic ${tone}">${icon(ic)}</span><span><span class="t">${title}</span><span class="s">${sub}</span></span><span class="chev">${icon('right')}</span></button>`;

  C.sheet = (title, body, opts = {}) => `<div class="overlay" data-action="${opts.dismiss === false ? '' : 'closeSheet'}" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-head"><h2 class="h2">${title}</h2>${opts.dismiss === false ? '' : `<button class="x" data-action="closeSheet" aria-label="${t('close')}">${icon('x')}</button>`}</div>${body}</div></div>`;

  C.osDialog = (title, sub, buttons) => `<div class="dialog-wrap"><div class="os-dialog" role="alertdialog" aria-label="${esc(title)}"><div class="body"><div class="t">${title}</div><div class="s">${sub}</div><span class="sim">${t('sim_dialog')}</span></div>${buttons.map(b => `<button class="${b.bold ? 'b' : ''}" data-action="${b.action}" data-arg="${b.arg || ''}">${b.label}</button>`).join('')}</div></div>`;

  C.disabledWhy = (text) => `<div class="disabled-why">${icon('info')}<span>${text}</span></div>`;

  C.callout = (tone, ic, html) => `<div class="callout ${tone}">${icon(ic)}<div>${html}</div></div>`;

  C.statusHero = (tone, ic, title, body) => `<div class="status-hero"><div class="ring ${tone}">${icon(ic)}</div><h2 class="h1">${title}</h2>${body ? `<p>${body}</p>` : ''}</div>`;

  FTG.C = C;
})();

  <script>
/* Free To Go — app core: state, domain rules, actions, render loop.
   Native mapping: state -> Zustand store slices; domain rules -> typed mock service layer (src/services/*). */
(function () {
  const t = FTG.t, C = FTG.C;
  let S;
  FTG.state = () => S;

  // ---------------- Selectors ----------------
  const store = FTG.store = (id) => S.stores.find(s => s.id === id);
  const offer = FTG.offer = (id) => S.offers.find(o => o.id === id);
  const city = FTG.city = (id) => FTG.CITIES.find(c => c.id === id);

  // Only launch-enabled offers are ever rendered: food vertical, free, public channel.
  FTG.isLaunchVisible = (o) => FTG.FLAGS.enabled_verticals.includes(o.vertical) && o.pricingMode === 'FREE' && o.priceMinor === 0 && o.accessChannel === 'PUBLIC' && o.campaignId == null;

  FTG.walkSignal = (o) => {
    const reps = o.reports || [];
    let lastM = -1; reps.forEach((r, i) => { if (r.merchant) lastM = i; });
    const after = reps.slice(lastM + 1);
    const last = reps[reps.length - 1] || null;
    const noneUsers = new Set(after.filter(r => r.lvl === 'NONE' && !r.merchant && S.now - r.at <= 30).map(r => r.by));
    let state = 'active';
    if (noneUsers.size >= 2) state = 'review';
    else if (last && last.lvl === 'NONE' && !last.merchant) state = 'possiblyGone';
    return { state, last };
  };

  FTG.offerState = (o) => {
    if (o.status === 'closed') return 'closed';
    if (o.status === 'ended') return 'ended';
    if (o.status === 'expired') return 'expired';
    if (o.distributionMode === 'WALK_IN' && S.now >= o.expiresAt) return 'expired';
    if (S.now >= o.end) return 'ended';
    if (o.distributionMode === 'RESERVED') {
      if (o.qtyLeft <= 0) return 'soldout';
      if (!o.reservationsOpen) return 'stopped';
      return 'active';
    }
    return FTG.walkSignal(o).state;
  };
  FTG.isGone = (st) => ['ended', 'expired', 'closed'].includes(st);

  FTG.myActive = () => S.reservations.find(r => r.userId === 'me' && r.status === 'confirmed');
  FTG.myReservations = () => S.reservations.filter(r => r.userId === 'me');

  FTG.discoverOffers = () => {
    const L = S.location, D = S.discover;
    if (L.mode === 'unset') return [];
    const q = D.q.trim().toLowerCase();
    let list = S.offers.filter(o => {
      if (!FTG.isLaunchVisible(o)) return false;
      const st = FTG.offerState(o), s = store(o.storeId);
      if (FTG.isGone(st)) return false;
      if (s.city !== L.city || s.km > L.km) return false;
      if (D.mode === 'reserved' && o.distributionMode !== 'RESERVED') return false;
      if (D.mode === 'walkin' && o.distributionMode !== 'WALK_IN') return false;
      if (D.cats.length && !o.categories.some(c => D.cats.includes(c))) return false;
      if (D.when === 'now' && !(o.start <= S.now)) return false;
      if (D.when === 'later' && !(o.start > S.now)) return false;
      if (!D.showSold && (st === 'soldout' || st === 'stopped')) return false;
      if (q) { const hay = (s.name + ' ' + s.kind.join(' ') + ' ' + o.categories.map(FTG.cat).join(' ') + ' ' + (o.what || '') + ' ' + o.description).toLowerCase(); if (!hay.includes(q)) return false; }
      return true;
    });
    const by = { distance: (a, b) => store(a.storeId).km - store(b.storeId).km, time: (a, b) => a.start - b.start, rating: (a, b) => C.overall(store(b.storeId).ratings) - C.overall(store(a.storeId).ratings) }[D.sort];
    return list.sort(by);
  };
  FTG.offersInArea = () => S.location.mode === 'unset' ? [] : S.offers.filter(o => FTG.isLaunchVisible(o) && !FTG.isGone(FTG.offerState(o)) && store(o.storeId).city === S.location.city && store(o.storeId).km <= S.location.km);
  FTG.activeFilterCount = () => { const D = S.discover; return D.cats.length + (D.when !== 'any') + (!D.showSold) + (D.sort !== 'distance'); };
  FTG.storeOffers = (id) => S.offers.filter(o => o.storeId === id && FTG.isLaunchVisible(o));

  // ---------------- Demo instrumentation ----------------
  FTG.emit = (ev) => { if (!S.demo.done.includes(ev)) S.demo.done.push(ev); };
  FTG.log = (fi, en) => { S.demo.log.unshift({ at: S.now, fi, en: en || fi }); S.demo.log = S.demo.log.slice(0, 30); };

  let toastTimer, pushTimer;
  FTG.toast = (msg, action, arg, label) => {
    S.toast = { msg, action, arg, label }; clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.toast = null; render(); }, action ? 5200 : 3200);
  };
  FTG.showPush = (p) => {
    S.push = p; clearTimeout(pushTimer);
    pushTimer = setTimeout(() => { S.push = null; render(); }, 8000);
    if (p.kind === 'offer') FTG.emit('pushShown');
    render();
  };

  // ---------------- Notifications: matching + dedup + quiet hours ----------------
  FTG.inQuiet = () => { if (!S.notif.quiet) return false; const s = C.parseT(S.notif.quietS), e = C.parseT(S.notif.quietE), n = S.now % 1440; return s > e ? (n >= s || n < e) : (n >= s && n < e); };

  FTG.matchAlerts = (o) => {
    const s = store(o.storeId), r = [];
    if (S.notif.fav && S.favorites.includes(s.id)) r.push({ k: 'favorite' });
    if (S.bells.includes(s.id)) r.push({ k: 'bell' });
    if (S.notif.radius && s.city === 'tampere' && s.km <= S.notif.radiusKm) r.push({ k: 'radius' });
    if (S.notif.cities.includes(s.city)) r.push({ k: 'city' });
    return r;
  };
  FTG.notifyNewOffer = (o) => {
    const s = store(o.storeId);
    const reasons = FTG.matchAlerts(o).map(x => x.k === 'city' ? Object.assign(x, { c: s.city }) : x);
    const names = reasons.map(x => x.k).join(' + ');
    if (!reasons.length) { FTG.log(`${s.name}: julkaisu, 0 osumaa → ei ilmoitusta`, `${s.name}: published, 0 matches → no alert`); return; }
    if (!FTG.FLAGS.push_alerts_enabled) return;
    if (S.notif.permission !== 'granted') { FTG.log(`${s.name}: ${reasons.length} osumaa, mutta ilmoitukset eivät ole sallittuja → ei lähetetty`, `${s.name}: ${reasons.length} matches but notifications not allowed → not sent`); return; }
    if (FTG.inQuiet()) { FTG.log(`${s.name}: ${reasons.length} osumaa → hiljainen aika, pidätetty klo ${S.notif.quietE} asti`, `${s.name}: ${reasons.length} matches → quiet hours, held until ${S.notif.quietE}`); FTG.emit('quietHeld'); return; }
    S.notifReasons[o.id] = reasons;
    FTG.log(`${s.name}: ${reasons.length} osumaa (${names}) → 1 ilmoitus (deduplikoitu)`, `${s.name}: ${reasons.length} matches (${names}) → 1 alert (deduplicated)`);
    if (reasons.length >= 4) FTG.emit('dedupShown');
    if (reasons.length === 1 && reasons[0].k === 'city' && s.city === 'tampere') FTG.emit('cityOnly');
    if (s.city !== 'tampere') FTG.emit('otherCity');
    const p = o.distributionMode === 'WALK_IN'
      ? { kind: 'offer', offerId: o.id, title: t('push_walkin_t', { store: s.name }), body: t('push_walkin_s', { what: o.what }) }
      : { kind: 'offer', offerId: o.id, title: t('push_new_bags_t', { store: s.name, n: o.qtyTotal }), body: t('push_new_bags_s', { s: C.fmt(o.start), e: C.fmt(o.end) }) };
    setTimeout(() => FTG.showPush(p), 650);
  };

  // reasons text helper (clean version)
  FTG.reasonText = (reasons) => reasons.map(x => {
    if (x.k === 'favorite') return t('reason_favorite');
    if (x.k === 'bell') return t('reason_bell');
    if (x.k === 'radius') return t('reason_radius', { km: S.notif.radiusKm, place: t('saved_place_home') });
    return t('reason_city', { c: city(x.c || 'tampere').name });
  }).join(', ');

  FTG.publish = (o) => { S.offers.unshift(o); FTG.notifyNewOffer(o); return o; };

  // ---------------- Clock ----------------
  FTG.advance = (mins, absolute) => {
    const prev = S.now; S.now = absolute != null ? absolute : S.now + mins;
    S.reservations.forEach(r => {
      const o = offer(r.offerId); if (!o || r.status !== 'confirmed') return;
      if (r.userId === 'me' && S.notif.remind && prev < o.start - 30 && S.now >= o.start - 30 && S.now < o.end) {
        FTG.showPush({ kind: 'remind', title: t('push_remind_t'), body: `${store(o.storeId).name} · ${C.fmt(o.start)}–${C.fmt(o.end)}` });
      }
      if (S.now >= o.end) r.status = 'expired';
    });
    S.offers.forEach(o => { if (o.distributionMode === 'WALK_IN' && o.status === 'active' && prev < o.expiresAt && S.now >= o.expiresAt) FTG.log(`${store(o.storeId).name}: ilmaisjako vanheni automaattisesti`, `${store(o.storeId).name}: giveaway expired automatically`); });
  };

  // ---------------- Actions ----------------
  const A = FTG.A = {};
  const top = () => S.stack[S.stack.length - 1];
  A.go = (tab) => { if (S.role === 'merchant') { S.mTab = tab; S.published = null; } else S.tab = tab; S.stack = []; };
  A.back = () => { S.stack.pop(); };
  A.closeSheet = () => { S.sheet = null; };
  A.noop = () => {};

  A.openOffer = (id) => {
    S.stack.push({ view: 'offer', id });
    const o = offer(id); if (o.distributionMode === 'WALK_IN') FTG.emit('walkinOpened');
  };
  A.openStore = (id) => { S.stack.push({ view: 'store', id }); };
  A.mapPin = (id) => { S.discover.selectedPin = id; };

  A.toggleFav = (id) => {
    const on = S.favorites.includes(id);
    if (on) { S.favorites = S.favorites.filter(x => x !== id); FTG.toast(t('fav_removed'), 'toggleFav', id, t('undo')); }
    else {
      S.favorites.push(id); FTG.emit('favorited');
      if (!S.bells.includes(id)) FTG.toast(t('fav_added_bell'), 'toggleBell', id, t('turn_on'));
      else FTG.toast(t('fav_added'));
    }
  };
  A.toggleBell = (id) => {
    const on = S.bells.includes(id);
    if (on) { S.bells = S.bells.filter(x => x !== id); FTG.toast(t('bell_off_toast', { s: store(id).name })); return; }
    if (S.notif.permission === 'unknown') { S.dialog = { type: 'push', then: ['bellOnNow', id] }; return; }
    A.bellOnNow(id);
  };
  A.bellOnNow = (id) => {
    if (!S.bells.includes(id)) S.bells.push(id);

    if (S.notif.permission === 'denied') FTG.toast(t('perm_denied'), 'openNotif', '', t('open_settings'));
    else FTG.toast(t('bell_on_toast', { s: store(id).name }));
  };
  A.pushAllow = () => { const th = S.dialog && S.dialog.then; S.notif.permission = 'granted'; S.dialog = null; if (th) A[th[0]](th[1]); };
  A.pushDeny = () => { const th = S.dialog && S.dialog.then; S.notif.permission = 'denied'; S.dialog = null; if (th) A[th[0]](th[1]); };
  A.askPush = () => { S.dialog = { type: 'push' }; };
  A.openDeviceSettings = () => { S.notif.permission = 'granted'; FTG.toast(t('perm_granted')); };

  // Notification preferences
  A.openNotif = () => { S.stack.push({ view: 'notif' }); FTG.emit('alertsOpened'); };
  A.openBells = () => { S.stack.push({ view: 'bells' }); };
  const needPerm = (key) => { if (S.notif.permission === 'unknown') { S.dialog = { type: 'push', then: ['setNotif', key] }; return true; } return false; };
  A.setNotif = (key) => { S.notif[key] = true; };
  A.notifToggle = (key) => { if (!S.notif[key] && (key === 'fav' || key === 'radius') && needPerm(key)) return; S.notif[key] = !S.notif[key]; };
  A.toggleCityAlert = (id) => {
    if (S.notif.cities.includes(id)) { S.notif.cities = S.notif.cities.filter(c => c !== id); return; }
    S.notif.cities.push(id);

  A.addCity = () => { S.sheet = { type: 'addCity' }; };
  A.turnOnAlerts = () => {
    // Empty-state shortcut: radius alerts around home + notifications permission.
    if (S.notif.permission === 'unknown') { S.dialog = { type: 'push', then: ['enableAreaAlerts'] }; return; }
    A.enableAreaAlerts();
  };
  A.enableAreaAlerts = () => { S.notif.radius = true; S.notif.fav = true; if (S.location.city && !S.notif.cities.includes(S.location.city)) S.notif.cities.push(S.location.city); FTG.toast(t('empty_alerts_on_t')); FTG.emit('bellOn'); };

  // Location
  A.openLocation = () => { S.sheet = { type: 'location' }; };
  A.useGps = () => { if (S.location.gps === 'denied') { S.sheet = { type: 'location', deniedAgain: true }; return; } S.dialog = { type: 'gps' }; };
  A.gpsAllow = () => { S.dialog = null; S.location = Object.assign(S.location, { mode: 'gps', city: 'tampere', gps: 'granted' }); S.sheet = null; FTG.emit('locationSet'); };
  A.gpsDeny = () => { S.dialog = null; S.location.gps = 'denied'; S.sheet = { type: 'location' }; };
  A.pickCity = (id) => { S.location.mode = 'city'; S.location.city = id; FTG.emit('locationSet'); };
  A.locDone = () => { S.sheet = null; if (S.location.mode === 'unset') { S.location.mode = 'city'; S.location.city = 'tampere'; FTG.emit('locationSet'); } };
  A.widenRadius = () => { S.location.km = Math.min(20, S.location.km < 10 ? 10 : 20); };

  // Discover
  A.setView = (v) => { S.discover.view = v; if (v === 'map') FTG.emit('mapOpened'); };
  A.setMode = (m) => { S.discover.mode = m; };
  A.openFilters = () => { S.sheet = { type: 'filters' }; };
  A.filterCat = (c) => { const D = S.discover; D.cats = D.cats.includes(c) ? D.cats.filter(x => x !== c) : D.cats.concat(c); };
  A.filterWhen = (w) => { S.discover.when = w; };
  A.filterSort = (w) => { S.discover.sort = w; };
  A.filterSold = () => { S.discover.showSold = !S.discover.showSold; };
  A.clearFilters = () => Object.assign(S.discover, { cats: [], when: 'any', showSold: true, sort: 'distance', q: '', mode: 'all' });

      }
      render();
    }, 900);
  };
  A.showCode = () => { S.stack = []; S.tab = 'pickups'; };
  A.backToDiscover = () => { S.sheet = null; S.stack = []; S.tab = 'discover'; };
  A.cancelRes = (id) => { S.sheet = { type: 'cancelRes', id }; };
  A.doCancelRes = (id) => { const r = S.reservations.find(x => x.id === id); r.status = 'cancelled_user'; offer(r.offerId).qtyLeft += 1; S.sheet = null; FTG.toast(t('st_cancelled_user')); };
  A.notReceived = (id) => { S.sheet = { type: 'notReceived', id, reason: null, text: '' }; };
  A.nrReason = (r) => { S.sheet.reason = r; };
  A.nrSend = () => { const r = S.reservations.find(x => x.id === S.sheet.id); r.status = 'not_received'; r.nr = S.sheet.reason; S.sheet = { type: 'nrSent' }; FTG.emit('notReceived'); };
  A.simScan = (id) => { const r = S.reservations.find(x => x.id === id); r.status = 'collected'; S.impact += 1; S.sheet = { type: 'collected', id }; FTG.emit('collected'); };
  A.directions = () => FTG.toast(t('directions_toast'));

  // Rating
  A.openRate = (id) => { S.sheet = null; S.stack.push({ view: 'rate', id, vals: { quality: 0, quantity: 0, variety: 0, smoothness: 0 }, tried: false }); };
  A.rateStar = (arg) => { const [k, v] = arg.split(':'); top().vals[k] = +v; };
  A.submitRating = () => {
    const v = top(); if (Object.values(v.vals).some(x => !x)) { v.tried = true; return; }
    const r = S.reservations.find(x => x.id === v.id) || S.history.find(x => x.id === v.id);

    ['quality', 'quantity', 'variety', 'smoothness'].forEach(k => { R[k] = (R[k] * n + v.vals[k]) / (n + 1); });

  A.report = (arg) => {

    S.myReports[id] = { lvl, at: S.now };

  A.walkStar = (arg) => { const [id, v] = arg.split(':'); S.myQuality[id] = { val: +v, saved: false }; };
  A.saveQuality = (id) => { S.myQuality[id].saved = true; FTG.toast(t('quality_saved')); };
  A.safety = () => { S.sheet = { type: 'safety', kind: null }; };
  A.safetyKind = (k) => { S.sheet.kind = k; };
  A.safetySend = () => { S.sheet = null; FTG.toast(t('safety_sent')); };

  // Push
  A.openPush = () => {
    const p = S.push; S.push = null; if (!p) return;
    S.role = 'collector';
    if (p.kind !== 'offer') { S.stack = []; S.tab = 'pickups'; return; }
    S.tab = 'discover'; S.stack = [{ view: 'offer', id: p.offerId }]; FTG.emit('pushOpened');
    S.sheet = { type: 'checking', recheck: true };
    setTimeout(() => {
      const o = offer(p.offerId), st = FTG.offerState(o);

  A.dismissPush = () => { S.push = null; };

  // Profile
  A.switchRole = () => { S.role = S.role === 'merchant' ? 'collector' : 'merchant'; S.stack = []; S.sheet = null; if (S.role === 'merchant') FTG.emit('roleMerchant'); };
  A.setRole = (r) => { if (S.role !== r) A.switchRole(); };
  A.openSheet = (type) => { S.sheet = { type }; };
  A.setLang = (i) => { FTG.lang = +i; S.lang = +i; S.sheet = null; };

  // Toast
  A.toastAction = () => { const tt = S.toast; S.toast = null; if (tt && tt.action) A[tt.action](tt.arg); };

  // Inputs (no full re-render while typing unless needed)
  const I = FTG.I = {};
  I.search = (v) => { S.discover.q = v; return true; };
  I.locRadius = (v) => { S.location.km = +v; return true; };
  I.notifRadius = (v) => { S.notif.radiusKm = +v; return true; };
  I.quietS = (v) => { S.notif.quietS = v; return true; };
  I.quietE = (v) => { S.notif.quietE = v; return true; };
  I.nrText = (v) => { S.sheet.text = v; return false; };

  // ---------------- Render loop ----------------
  const root = () => document.getElementById('app');
  const demoRoot = () => document.getElementById('demo');

  function render() {
    if (!S) return;
    const r = root();
    const scrolls = {}; r.querySelectorAll('[data-skey]').forEach(el => { scrolls[el.dataset.skey] = el.scrollTop; });
    const ae = document.activeElement, fkey = ae && ae.dataset && ae.dataset.fkey, sel = fkey && ae.selectionStart;
    r.innerHTML = FTG.V.screen();
    r.querySelectorAll('[data-skey]').forEach(el => { if (scrolls[el.dataset.skey] != null) el.scrollTop = scrolls[el.dataset.skey]; });
    if (fkey) { const el = r.querySelector(`[data-fkey="${fkey}"]`); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) { } } }
    const d = demoRoot(); if (d) { const st = d.scrollTop; d.innerHTML = FTG.V.demo(); d.scrollTop = st; }
    document.documentElement.lang = FTG.lang ? 'en' : 'fi';
  }
  FTG.render = render;

  FTG.reset = (id) => {
    const lang = S ? S.lang : 0;
    S = FTG.SCENARIOS[id].build();
    S.lang = lang; FTG.lang = lang; S.demo.scenario = id;
    FTG.log(`Skenaario ladattu: ${FTG.SCENARIOS[id].title[0]}`, `Scenario loaded: ${FTG.SCENARIOS[id].title[1]}`);
    render();
  };

  function handle(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.self && e.target !== el) return; // scrim click only
    const name = el.dataset.action; if (!name) return;
    const fn = A[name] || (FTG.MA && FTG.MA[name]) || (FTG.DA && FTG.DA[name]);
    if (!fn) { console.warn('No action', name); return; }
    e.preventDefault();
    fn(el.dataset.arg, el, e);
    render();
  }
  function onInput(e) {
    const el = e.target.closest('[data-input]'); if (!el) return;
    const fn = I[el.dataset.input] || (FTG.MI && FTG.MI[el.dataset.input]);
    if (!fn) return;
    const v = el.type === 'checkbox' ? el.checked : el.value;
    const rerender = fn(v, el);
    if (rerender || e.type === 'change') render();
  }

  document.addEventListener('click', handle);
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=link][data-action]')) { e.preventDefault(); handle(e); }
    if (e.key === 'Escape' && S && (S.sheet || S.dialog)) { S.sheet = null; S.dialog = null; render(); }
  });
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);

  FTG.boot = () => { FTG.reset('explore'); };
})();

  <script>
/* Free To Go — collector views and shared screen shell. */
(function () {

  const V = FTG.V = {};
  const S = () => FTG.state();

  // ---------------- Shell ----------------
  V.screen = () => {

    let html = `<div class="statusbar"><span>${fmt(s.now)}</span><span class="notch"></span><span style="display:flex;gap:6px;align-items:center">${icon('wifi').replace('<svg', '<svg style="width:16px;height:16px"')}<span style="display:inline-block;width:24px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative"><i style="position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px"></i></span></span></div><div class="app">`;
    if (s.role === 'merchant') html += FTG.MV.main(); else html += V.main();
    html += (s.role === 'merchant' ? FTG.MV.tabbar() : V.tabbar());

    if (s.sheet) html += (V.sheets[s.sheet.type] || FTG.MV.sheets[s.sheet.type])(s.sheet);
    if (s.dialog) html += V.dialogs[s.dialog.type](s.dialog);
    if (s.camera) html += FTG.MV.camera();
    if (s.push) html += V.push(s.push);
    if (s.toast) html += `<div class="toast ${tp ? 'high' : ''}" role="status"><span class="grow">${esc(s.toast.msg)}</span>${s.toast.action ? `<button data-action="toastAction">${esc(s.toast.label)}</button>` : ''}</div>`;
    return html;
  };

  V.tabbar = () => {
    const s = S(), n = FTG.myActive() ? 1 : 0;
    const tabs = [['discover', 'discover', 'tab_discover'], ['favorites', 'heart', 'tab_favorites'], ['pickups', 'bag', 'tab_pickups'], ['profile', 'user', 'tab_profile']];
    return `<nav class="tabbar" aria-label="${t('app_name')}">${tabs.map(([id, ic, lbl]) => `<button class="tab ${s.tab === id ? 'on' : ''}" data-action="go" data-arg="${id}" aria-current="${s.tab === id ? 'page' : 'false'}">${icon(ic)}<span>${t(lbl)}</span>${id === 'pickups' && n ? `<span class="dot">${n}</span>` : ''}</button>`).join('')}</nav>`;
  };

  V.main = () => {
    const s = S();
    return { discover: V.discover, favorites: V.favorites, pickups: V.pickups, profile: V.profile }[s.tab]();
  };

  V.stackView = (tp) => ({ offer: V.offerDetail, store: V.storePage, reserved: V.reservedView, rate: V.rateView, notif: V.notifSettings, bells: V.bellsView }[tp.view])(tp);

  V.rolePill = () => `<button class="role-pill" data-action="switchRole">${icon('swap').replace('<svg', '<svg style="width:16px;height:16px"')}${t('switch_to_merchant')}</button>`;
  V.mockbar = () => `<div class="mockbar">${icon('info').replace('<svg', '<svg style="width:16px;height:16px;flex:none"')}<span>${t('mock_banner')}</span></div>`;

  // ---------------- Discover ----------------
  V.discover = () => {
    const s = S(), L = s.location, D = s.discover;
    const c = L.city && FTG.city(L.city);
    const title = L.mode === 'unset' ? t('loc_choose') : c.name;
    const sub = L.mode === 'unset' ? '' : (L.mode === 'gps' ? t('loc_current') + ' · ' : '') + t('loc_within', { km: L.km });
    const nf = FTG.activeFilterCount();
    let h = `<div class="scroll" data-skey="discover"><div class="topbar"><button class="loc-chip" data-action="openLocation">${icon('pin')}<span style="min-width:0"><span class="t">${esc(title)}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</span>${icon('down')}</button>${V.rolePill()}</div>`;
    h += `<div class="searchrow"><label class="search">${icon('search')}<span class="sr-only">${t('search_ph')}</span><input type="search" placeholder="${t('search_ph')}" value="${esc(D.q)}" data-input="search" data-fkey="search"></label><button class="icon-btn" data-action="openFilters" aria-label="${t('filters')}">${icon('sliders')}${nf ? `<span class="badge-n">${nf}</span>` : ''}</button></div>`;
    h += `<div class="chips" role="group">${[['all', 'mode_all'], ['reserved', 'mode_reserved'], ['walkin', 'mode_walkin']].map(([m, k]) => `<button class="chip ${D.mode === m ? 'on' : ''}" data-action="setMode" data-arg="${m}" aria-pressed="${D.mode === m}">${m === 'reserved' ? `<span class="sw" style="background:var(--berry-600)"></span>` : m === 'walkin' ? `<span class="sw" style="background:var(--hatch)"></span>` : ''}${t(k)}</button>`).join('')}</div>`;

    if (L.mode === 'unset') {
      h += V.mockbar();
      h += C.empty({ title: t('pick_location_title'), body: t('pick_location_body'), actions: C.actionCard('useGps', '', 'nav', 'berry', t('loc_use_gps'), t('loc_use_gps_s')) + C.actionCard('openLocation', '', 'city', 'saffron', t('loc_pick_city'), FTG.CITIES.slice(0, 4).map(c => c.name).join(', ') + '…') });
      return h + `<div style="height:24px"></div></div>`;
    }
    const list = FTG.discoverOffers();
    const area = FTG.offersInArea();
    h += `<div class="pad mt-3 between"><span class="small muted bold">${t('results_n', { n: list.length })}</span><div class="seg" style="width:184px">${[['list', 'list', 'view_list'], ['map', 'map', 'view_map']].map(([v, ic, k]) => `<button class="${D.view === v ? 'on' : ''}" data-action="setView" data-arg="${v}" aria-pressed="${D.view === v}">${icon(ic).replace('<svg', '<svg style="width:18px;height:18px"')}${t(k)}</button>`).join('')}</div></div>`;
    h += V.mockbar();

    if (!area.length) { h += V.emptyArea(); return h + `<div style="height:24px"></div></div>`; }
    if (!list.length) {
      h += C.empty({ title: t('no_match_title'), body: t('no_match_body'), art: false, actions: `<button class="btn secondary block" data-action="clearFilters">${t('clear_filters')}</button>` });
      return h + '</div>';
    }
    if (D.view === 'map') { h += V.mapView(list); return h + `<div style="height:24px"></div></div>`; }

    const ctx = (o) => ({ now: s.now, fav: s.favorites.includes(o.storeId), lastReport: o.distributionMode === 'WALK_IN' ? FTG.walkSignal(o).last : null });
    const groups = [['now_title', o => o.start <= s.now && !['soldout', 'stopped'].includes(FTG.offerState(o))], ['later_title', o => o.start > s.now && !['soldout', 'stopped'].includes(FTG.offerState(o))], ['sold_out_title', o => ['soldout', 'stopped'].includes(FTG.offerState(o))]];
    h += `<div class="pad">`;
    groups.forEach(([k, f]) => {
      const g = list.filter(f); if (!g.length) return;
      h += `<div class="section-title"><h2 class="h3">${t(k)}</h2><span class="small muted">${g.length}</span></div><div class="cards">${g.map(o => C.offerCard(o, FTG.store(o.storeId), FTG.offerState(o), ctx(o))).join('')}</div>`;
    });
    return h + `</div><div style="height:24px"></div></div>`;
  };

  V.emptyArea = () => {
    const s = S(), alertsOn = s.notif.permission === 'granted' && (s.notif.radius || s.notif.cities.includes(s.location.city) || s.bells.length);
    let a = alertsOn
      ? C.actionCard('openNotif', '', 'bellFill', 'ink', t('empty_alerts_on_t'), t('empty_alerts_on_s'))
      : C.actionCard('turnOnAlerts', '', 'bell', 'ink', t('empty_alerts_t'), t('empty_alerts_s'));
    if (s.location.km < 20) a += C.actionCard('widenRadius', '', 'map', 'saffron', t('empty_radius_t'), t('empty_radius_s', { km: s.location.km }));
    let h = C.empty({ title: t('empty_title'), body: t('empty_body'), actions: a });
    const stores = s.stores.filter(x => x.city === s.location.city);
    if (stores.length) {
      h += `<div class="pad"><div class="section-title"><h2 class="h3">${t('participating')}</h2></div><p class="small muted">${t('participating_s')}</p><div class="list">${stores.map(st => V.storeRow(st)).join('')}</div></div>`;
    }
    return h;
  };

  V.storeRow = (st, subText) => {
    const s = S();
    const sub = subText || `${st.kind[FTG.lang]} · ${t('km', { d: C.km(st.km) })}`;
    return `<div class="row-item"><button class="grow" style="display:flex;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left;min-height:48px" data-action="openStore" data-arg="${st.id}">${C.avatar(st, 'sm')}<span style="min-width:0"><span class="t">${esc(st.name)}</span><span class="s">${sub}</span></span></button><span class="r">${C.heart(st.id, s.favorites.includes(st.id))}${C.bell(st.id, s.bells.includes(st.id))}</span></div>`;
  };

  V.mapView = (list) => {
    const s = S(), D = s.discover;
    const sel = list.find(o => o.id === D.selectedPin) || null;
    const pins = list.map(o => { const st = FTG.store(o.storeId), state = FTG.offerState(o); return { id: o.id, x: st.x, y: st.y, mode: o.distributionMode, label: o.distributionMode === 'WALK_IN' ? '?' : String(o.qtyLeft), dim: state !== 'active' && o.distributionMode === 'RESERVED', selected: sel && sel.id === o.id }; });
    let h = `<div class="map-wrap">${FTG.mapSvg(pins, { me: s.location.mode === 'gps', radius: 150 })}<span class="map-label badge outline">${icon('map')}${t('sim_map')}</span>`;
    if (sel) h += `<div class="map-peek">${C.offerCard(sel, FTG.store(sel.storeId), FTG.offerState(sel), { now: s.now, fav: s.favorites.includes(sel.storeId), lastReport: sel.distributionMode === 'WALK_IN' ? FTG.walkSignal(sel).last : null }).replace('class="card', 'class="card compact')}</div>`;
    h += `</div><div class="pad mt-2 small muted gap-row"><span class="badge reserve">${icon('bag')}${t('reserve_badge')}</span><span class="small">= ${FTG.lang ? 'bags left' : 'kasseja jäljellä'}</span><span class="badge walkin">?</span><span class="small">= ${t('walkin_badge').toLowerCase()}</span></div>`;
    return h;
  };

  // ---------------- Offer detail ----------------
  V.offerDetail = (tp) => {
    const s = S(), o = FTG.offer(tp.id), st = FTG.store(o.storeId), state = FTG.offerState(o);
    const walk = o.distributionMode === 'WALK_IN';
    const fav = s.favorites.includes(st.id), bell = s.bells.includes(st.id);
    let h = `<div class="detail"><div class="scroll" data-skey="offer-${o.id}"><div class="hero">${C.photo(o, st)}<div class="hero-actions"><button class="back float" data-action="back" aria-label="${t('back')}">${icon('left')}</button><div class="r">${C.heart(st.id, fav)}${C.bell(st.id, bell)}</div></div><span class="photo-tag-wrap" style="position:absolute;left:16px;bottom:36px">${C.photoTag(o)}</span></div>`;
    h += `<div class="sheet-card"><div style="display:flex;gap:12px;align-items:center">${C.avatar(st, 'lg')}<div style="min-width:0;flex:1"><h1 class="h2">${esc(st.name)}</h1><button class="btn ghost" style="padding:0;min-height:28px" data-action="openStore" data-arg="${st.id}">${st.kind[FTG.lang]} · ${t('open_store')}</button></div><div class="zero" style="font-size:26px">${t('free')}<small>${t('free_s')}</small></div></div>`;
    h += `<div class="gap-row mt-3">${C.modeBadge(o)}${C.statusBadge(o, state)}${!walk && state === 'active' ? '' : ''}</div>`;
    const reasons = s.notifReasons[o.id];
    if (reasons) h += C.callout('info', 'bell', `<span class="why-notified">${t('why_notified', { r: FTG.reasonText(reasons) })}</span>`);
    h += `</div><div class="pad" style="padding-bottom:20px">`;

    if (walk) h += V.walkinPanel(o, state);
    else h += `<div class="mode-panel reserve"><span class="ic">${icon('bag')}</span><div><div class="bold">${t('reserve_explain_t')}</div><div class="small muted">${t('reserve_explain_s')}</div>${state !== 'ended' ? `<div class="mt-2"><div class="between small bold"><span>${t('bags_left_of', { n: o.qtyLeft, t: o.qtyTotal })}</span></div><div class="progress mt-2"><i style="width:${(o.qtyLeft / o.qtyTotal) * 100}%"></i></div></div>` : ''}</div></div>`;

    // Pickup + address
    h += `<div class="block"><div class="info-row"><span class="ic">${icon('clock')}</span><div><div class="t">${t('pickup_time')}</div><div class="s">${t('today')} ${fmt(o.start)}–${fmt(o.end)}${o.start > s.now ? ' · ' + t('starts_at', { t: fmt(o.start) }) : ''}</div></div></div><div class="info-row"><span class="ic">${icon('pin')}</span><div style="flex:1;min-width:0"><div class="t">${esc(st.address)}</div><div class="s">${t('km', { d: C.km(st.km) })}</div></div><button class="btn secondary sm" data-action="directions">${icon('nav').replace('<svg', '<svg style="width:16px;height:16px"')}${t('directions')}</button></div><div class="mini-map">${FTG.mapSvg([{ id: o.id, x: .5, y: .55, mode: o.distributionMode, label: walk ? '?' : String(o.qtyLeft) }], { h: 132 })}</div></div>`;

    // Contents
    if (walk) {
      h += `<div class="block"><h3>${t('walkin_available')}</h3><p>${esc(o.what)}</p>${o.categories.length ? C.categoryTags(o.categories) : ''}</div>`;
    } else {
      h += `<div class="block"><h3>${t('possible_contents')}</h3>${C.categoryTags(o.categories)}<div class="caveat">${t('contents_caveat')}</div>${o.description ? `<h3 class="mt-4">${t('from_shop')}</h3><p class="muted">${esc(o.description)}</p>` : ''}</div>`;
    }
    if (walk) h += V.reportBlock(o, state);
    h += C.ratingBlock(st);
    h += `<div class="block"><h3>${t('good_to_know')}</h3><p class="small muted">${t('allergen_note')}</p><p class="small muted">${t('bring_bag')}</p><button class="btn ghost" style="padding:0" data-action="safety">${icon('flag')}${t('safety_link')}</button></div>`;
    h += `</div></div>`;
    h += V.ctaBar(o, state);
    return h + `</div>`;
  };

  V.walkinPanel = (o, state) => {
    const s = S();
    let h = `<div class="mode-panel walkin"><div class="hatch-head">${t('walkin_label')}</div><div class="inner">${t('walkin_explain')}<div class="mt-2 bold">${t('published_ago', { a: C.ago(o.publishedAt, s.now) })} · ${t('photo_today', { t: fmt(o.photo.at) })}</div></div></div>`;
    const sig = FTG.walkSignal(o);
    if (state === 'closed') h += C.callout('danger', 'hand', `<b>${t('closed_t')}</b><br>${t('closed_s', { a: C.ago(o.closedAt, s.now) })}`);
    else if (state === 'expired') h += C.callout('info', 'clock', `<b>${t('expired_t')}</b><br>${t('expired_s')}`);
    else if (state === 'review') h += C.callout('danger', 'alert', `<b>${t('review_t')}</b><br>${t('review_s')}`);
    else if (state === 'possiblyGone') h += C.callout('warn', 'alert', `<b>${t('possibly_gone_t')}</b><br>${t('possibly_gone_s', { a: C.ago(sig.last.at, s.now) })}`);
    return h;
  };

  V.reportBlock = (o, state) => {
    const s = S(), mine = s.myReports[o.id];
    const live = !FTG.isGone(state);
    let h = `<div class="block">`;
    if (live) {
      h += `<h3>${t('report_title')}</h3><p class="small muted">${t('report_sub')}</p><div class="report-grid">${['MANY', 'LOW', 'NONE'].map(l => `<button class="report-btn ${mine && mine.lvl === l ? 'on' : ''}" data-action="report" data-arg="${o.id}:${l}" aria-pressed="${!!(mine && mine.lvl === l)}">${icon(l === 'MANY' ? 'crateMany' : l === 'LOW' ? 'crateLow' : 'crateNone')}<span>${t('r_' + l)}</span></button>`).join('')}</div>`;
      if (mine) h += `<p class="small mt-2" style="color:var(--ink-700)">${t('report_yours', { r: t('r_' + mine.lvl), a: C.ago(mine.at, s.now) })}</p>`;
    }
    h += `<h3 class="mt-4">${t('latest_reports')}</h3>`;
    const reps = (o.reports || []).slice().reverse().slice(0, 4);
    if (!reps.length) h += `<p class="small muted">${t('no_reports')}</p>`;
    else h += `<div class="report-list">${reps.map(r => { const stale = s.now - r.at > 45; return `<div class="report-item"><span class="lvl ${r.lvl}"></span><span><b>${t('r_' + r.lvl)}</b> · ${C.ago(r.at, s.now)}<br><span class="muted xs">${r.merchant ? t('merchant_confirmed') : (r.by === 'me' ? t('you') + ' · ' : '') + t('unverified')}${stale ? ' · ' + t('stale') : ''}</span></span></div>`; }).join('')}</div>`;
    h += `</div>`;
    // Optional, separate quality rating
    const q = s.myQuality[o.id] || { val: 0, saved: false };
    h += `<div class="block"><h3>${t('quality_optional_t')}</h3><p class="small muted">${t('quality_optional_s')}</p>${C.starInput('walkStar', o.id, q.val, t('quality_optional_t'))}${q.val && !q.saved ? `<button class="btn secondary sm mt-2" data-action="saveQuality" data-arg="${o.id}">${t('save_rating')}</button>` : ''}${q.saved ? `<p class="small mt-2" style="color:var(--success-700)">${icon('check').replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-3px"')} ${t('quality_saved')}</p>` : ''}</div>`;
    return h;
  };

  V.ctaBar = (o, state) => {
    const s = S(), walk = o.distributionMode === 'WALK_IN', st = FTG.store(o.storeId);
    let h = `<div class="cta-bar">`;
    if (walk) {
      if (FTG.isGone(state)) return h + `<button class="btn block" disabled>${t('cta_ended')}</button>${C.disabledWhy(t('cta_ended_why'))}</div>`;
      return h + `<button class="btn saffron block" data-action="directions">${icon('nav')}${t('directions')}</button>${C.disabledWhy(t('no_reserve_needed'))}</div>`;
    }
    const mine = FTG.myActive();
    if (mine && mine.offerId === o.id) return h + `<button class="btn dark block" data-action="showCode">${icon('qr')}${t('view_my_pickup')}</button></div>`;
    if (FTG.isGone(state)) return h + `<button class="btn block" disabled>${t('cta_ended')}</button>${C.disabledWhy(t('cta_ended_why'))}</div>`;
    if (state === 'soldout' || state === 'stopped') return h + `<button class="btn block" disabled>${t('cta_soldout')}</button>${C.disabledWhy(t('cta_soldout_why'))}${!s.bells.includes(st.id) ? `<button class="btn secondary block mt-2" data-action="toggleBell" data-arg="${st.id}">${icon('bell')}${t('turn_bell_on')}</button>` : ''}</div>`;
    if (mine) return h + `<button class="btn block" disabled>${t('cta_has_active')}</button>${C.disabledWhy(t('cta_has_active_why'))}</div>`;
    return h + `<div class="line"><span class="bold">${t('free')} · ${t('left_n', { n: o.qtyLeft })}</span><span class="muted">${t('today')} ${fmt(o.start)}–${fmt(o.end)}</span></div><button class="btn primary block" data-action="reserve" data-arg="${o.id}">${t('reserve_cta')}</button></div>`;
  };

  // ---------------- Store page ----------------
  V.storePage = (tp) => {
    const s = S(), st = FTG.store(tp.id);
    const offers = FTG.storeOffers(st.id).filter(o => !FTG.isGone(FTG.offerState(o)));
    let h = `<div class="detail"><div class="scroll" data-skey="store-${st.id}"><div class="hero" style="height:200px">${FTG.art(st.art, st.id)}<div class="hero-actions"><button class="back float" data-action="back" aria-label="${t('back')}">${icon('left')}</button></div></div>`;
    h += `<div class="sheet-card"><div style="display:flex;gap:12px;align-items:center">${C.avatar(st, 'lg')}<div><h1 class="h2">${esc(st.name)}</h1><div class="small muted">${st.kind[FTG.lang]} · ${esc(st.address)}</div></div></div><div class="pair mt-4">${C.heartCard(st.id, s.favorites.includes(st.id))}${C.bellCard(st.id, s.bells.includes(st.id))}</div></div><div class="pad" style="padding-bottom:28px">`;
    if (offers.length) h += `<div class="section-title"><h2 class="h3">${t('today')}</h2></div><div class="cards">${offers.map(o => C.offerCard(o, st, FTG.offerState(o), { now: s.now, fav: s.favorites.includes(st.id), lastReport: o.distributionMode === 'WALK_IN' ? FTG.walkSignal(o).last : null })).join('')}</div>`;
    else h += `<div class="block center"><p class="bold">${t('fav_no_offer')}</p><p class="small muted">${t('participating_s')}</p></div>`;
    h += C.ratingBlock(st);
    h += `</div></div></div>`;
    return h;
  };

  // ---------------- Reserved success ----------------
  V.reservedView = (tp) => {
    const r = S().reservations.find(x => x.id === tp.id), o = FTG.offer(r.offerId), st = FTG.store(o.storeId);
    return `<div class="detail"><div class="scroll" data-skey="reserved" style="padding-top:var(--safe-top)"><div class="pad">${C.statusHero('berry', 'check', t('reserved_title'), t('reserved_body', { store: esc(st.name), s: fmt(o.start), e: fmt(o.end) }))}<div class="block"><div class="kv"><span class="k">${t('pickup_code')}</span><span class="v">${r.code}</span></div><div class="kv"><span class="k">${t('pickup_time')}</span><span class="v">${t('today')} ${fmt(o.start)}–${fmt(o.end)}</span></div><div class="kv"><span class="k">${t('address')}</span><span class="v">${esc(st.address)}</span></div><div class="kv"><span class="k">${t('free_s')}</span><span class="v">${t('free')}</span></div></div></div></div><div class="cta-bar"><button class="btn primary block" data-action="showCode">${icon('qr')}${t('show_code')}</button><button class="btn ghost block mt-2" data-action="backToDiscover">${t('back_discover')}</button></div></div>`;
  };

  // ---------------- Pickups ----------------
  V.pickups = () => {
    const s = S(), mine = FTG.myReservations();
    const active = mine.filter(r => r.status === 'confirmed');
    const cancelled = mine.filter(r => r.status === 'cancelled_merchant');
    const past = mine.filter(r => !['confirmed'].includes(r.status));
    let h = `<div class="scroll" data-skey="pickups"><div class="view-pad"><h1 class="h1" style="margin:8px 0 4px">${t('pickups_title')}</h1>`;
    cancelled.filter(r => !r.ack).forEach(r => { const o = FTG.offer(r.offerId); h += C.callout('danger', 'alert', `<b>${t('merchant_cancelled_t')}</b><br>${esc(FTG.store(o.storeId).name)} – ${t('merchant_cancelled_s', { r: t(r.reasonKey) })}`); });
    if (!active.length && !past.length && !s.history.length) {
      h += C.empty({ title: t('no_pickups_t'), body: t('no_pickups_s'), actions: `<button class="btn primary block" data-action="go" data-arg="discover">${t('find_food')}</button>` });
      return h + '</div></div>';
    }
    active.forEach(r => { h += V.ticket(r); });
    if (!active.length) h += `<div class="block center mt-3"><p class="bold">${t('no_pickups_t')}</p><button class="btn secondary mt-2" data-action="go" data-arg="discover">${t('find_food')}</button></div>`;
    h += `<div class="section-title"><h2 class="h3">${t('history')}</h2></div><div class="list">`;
    past.slice().reverse().forEach(r => { const o = FTG.offer(r.offerId), st = FTG.store(o.storeId); h += V.historyRow(st, t('today'), r.status, r, !!r.rated); });
    s.history.forEach(hh => { const st = FTG.store(hh.storeId); h += V.historyRow(st, hh.day, hh.status, hh, hh.rated, hh.walkIn); });
    return h + `</div><div style="height:24px"></div></div></div>`;
  };

  const stKey = { confirmed: 'st_confirmed', collected: 'st_collected', cancelled_user: 'st_cancelled_user', cancelled_merchant: 'st_cancelled_merchant', not_received: 'st_not_received', expired: 'st_expired' };
  const stTone = { collected: 'ok', cancelled_merchant: 'danger', not_received: 'warn', expired: 'ended', cancelled_user: 'ended', confirmed: 'outline' };
  V.historyRow = (st, day, status, rec, rated, walk) => {
    const canRate = status === 'collected' && !rated && !walk;
    return `<div class="row-item">${C.avatar(st, 'sm')}<div class="grow"><span class="t">${esc(st.name)}</span><span class="s">${day} · ${walk ? t('walkin_badge') : t('surprise_bag')}</span></div><div class="r">${canRate ? `<button class="btn primary sm" data-action="openRate" data-arg="${rec.id}">${t('rate_cta')}</button>` : `<span class="badge ${stTone[status] || 'outline'}">${status === 'collected' && rated ? t('rated') : t(stKey[status])}</span>`}</div></div>`;
  };

  V.ticket = (r) => {
    const s = S(), o = FTG.offer(r.offerId), st = FTG.store(o.storeId);
    const open = s.now >= o.start;
    return `<div class="ticket mt-3"><div class="head"><div class="small" style="opacity:.85">${t('active_pickup')}</div><div class="h2">${esc(st.name)}</div><div class="small">${t('today')} ${fmt(o.start)}–${fmt(o.end)} · ${esc(st.address)}</div></div><div class="qr">${FTG.qrSvg(r.code)}<span class="badge outline mt-2">${t('sim_qr')}</span></div><div class="code">${r.code}</div><p class="small muted center pad mt-2">${t('pickup_code_s')}</p><div class="perf"></div><div class="foot">${C.callout(open ? 'ok' : 'info', 'clock', open ? t('pickup_open_now', { t: fmt(o.end) }) : t('pickup_opens', { t: fmt(o.start) }))}<div class="pair mt-3"><button class="btn secondary sm" data-action="directions">${t('directions')}</button><button class="btn danger sm" data-action="cancelRes" data-arg="${r.id}">${t('cancel_reservation')}</button></div>${open ? `<button class="btn ghost block mt-2" data-action="notReceived" data-arg="${r.id}">${icon('alert')}${t('not_received')}</button>` : `<p class="xs muted center mt-2">${t('not_received')}: ${t('pickup_opens', { t: fmt(o.start) }).toLowerCase()}</p>`}<div class="center mt-2"><button class="demo-act" data-action="simScan" data-arg="${r.id}"><b>${t('demo_tag')}</b>${t('demo_scan')}</button></div></div></div>`;
  };

  // ---------------- Rating ----------------
  V.rateView = (tp) => {
    const s = S();
    const rec = s.reservations.find(x => x.id === tp.id) || s.history.find(x => x.id === tp.id);
    const st = FTG.store(rec.storeId || FTG.offer(rec.offerId).storeId);
    const missing = Object.values(tp.vals).some(v => !v);
    let h = `<div class="detail"><div class="scroll" data-skey="rate" style="padding-top:var(--safe-top)"><div class="navbar"><button class="back" data-action="back" aria-label="${t('back')}">${icon('left')}</button><span class="title">${t('rate_title')}</span></div><div class="pad"><div style="display:flex;gap:12px;align-items:center">${C.avatar(st, 'lg')}<div><div class="h2">${esc(st.name)}</div><div class="small muted">${t('surprise_bag')} · ${t('st_collected')}</div></div></div><p class="small muted mt-3">${t('rate_s')}</p><div class="block">`;
    [['quality', 'rate_q_quality'], ['quantity', 'rate_q_quantity'], ['variety', 'rate_q_variety'], ['smoothness', 'rate_q_smoothness']].forEach(([k, l]) => { h += `<div class="rate-row"><div class="bold">${t(l)}</div>${C.starInput('rateStar', k, tp.vals[k], t(l))}</div>`; });
    h += `</div>${C.callout('info', 'shield', `${t('reliability')}: ${t('reliability_s', { ok: st.rel.ok, f: st.rel.fail })}`)}</div></div><div class="cta-bar"><button class="btn primary block" data-action="submitRating" ${missing ? 'aria-disabled="true"' : ''}>${t('submit_rating')}</button>${missing ? C.disabledWhy(t('rate_missing')) : ''}</div></div>`;
    return h;
  };

  // ---------------- Favorites ----------------
  V.favorites = () => {
    const s = S();
    const favs = s.favorites.map(FTG.store), bellsOnly = s.bells.filter(b => !s.favorites.includes(b)).map(FTG.store);
    const nSources = (s.notif.fav ? 1 : 0) + (s.bells.length ? 1 : 0) + (s.notif.radius ? 1 : 0) + s.notif.cities.length;
