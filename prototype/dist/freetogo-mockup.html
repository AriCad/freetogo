    let h = `<div class="detail"><div class="scroll" data-skey="offer-${o.id}"><div class="hero">${C.photo(o, st)}<div class="hero-actions"><button class="back float" data-action="back" aria-label="${t('back')}">${icon('left')}</button><div class="r">${C.heart(st.id, fav)}${C.bell(st.id, bell)}</div></div><span class="photo-tag-wrap" style="position:absolute;left:16px;bottom:36px">${C.photoTag(o)}</span></div>`;
    h += `<div class="sheet-card"><div style="display:flex;gap:12px;align-items:center">${C.avatar(st, 'lg')}<div style="min-width:0;flex:1"><h1 class="h2">${esc(st.name)}</h1><button class="btn ghost" style="padding:0;min-height:28px" data-action="openStore" data-arg="${st.id}">${st.kind[FTG.lang]} · ${t('open_store')}</button></div><div class="zero" style="font-size:26px">${t('free')}<small>${t('free_s')}</small></div></div>`;
    h += `<div class="gap-row mt-3">${C.modeBadge(o)}${C.statusBadge(o, state)}${!walk && state === 'active' ? '' : ''}</div>`;
    const reasons = s.notifReasons[o.id];
    if (reasons) h += C.callout('info', 'bell', `<span class="why-notified">${t('why_notified', { r: FTG.reasonText(reasons) })}</span>`);
    h += `</div><div class="pad" style="padding-bottom:20px">`;

    if (walk) h += V.walkinPanel(o, state);
    else h += `<div class="mode-panel reserve"><span class="ic">${icon('bag')}</span><div><div class="bold">${t('reserve_explain_t')}</div><div class="small muted">${t('reserve_explain_s')}</div>${state !== 'ended' ? `<div class="mt-2"><div class="between small bold"><span>${t('bags_left_of', { n: o.qtyLeft, t: o.qtyTotal })}</span></div><div class="progress mt-2"><i style="width:${(o.qtyLeft / o.qtyTotal) * 100}%"></i></div></div>` : ''}</div></div>`;

    // Pickup + address
    h += `<div class="block"><div class="info-row"><span class="ic">${icon('clock')}</span><div><div class="t">${t('pickup_time')}</div><div class="s">${t('today')} ${fmt(o.start)}–${fmt(o.end)}${o.start > s.now ? ' · ' + t('starts_at', { t: fmt(o.start) }) : ''}</div></div></div><div class="info-row"><span class="ic">${icon('pin')}</span><div style="flex:1;min-width:0"><div class="t">${esc(st.address)}</div><div class="s">${t('km', { d: C.km(st.km) })}</div></div><button class="btn secondary sm" data-action="directions">${icon('nav').replace('<svg', '<svg style="width:16px;height:16px"')}${t('directions')}</button></div><div class="mini-map">${FTG.mapSvg([{ id: o.id, x: .5, y: .55, mode: o.distributionMode, label: walk ? '?' : String(o.qtyLeft) }], { h: 132 })}</div></div>`;

    // Contents
    if (walk) {
      h += `<div class="block"><h3>${t('walkin_available')}</h3><p>${esc(o.what)}</p>${o.categories.length ? C.categoryTags(o.categories) : ''}</div>`;
    } else {
      h += `<div class="block"><h3>${t('possible_contents')}</h3>${C.categoryTags(o.categories)}<div class="caveat">${t('contents_caveat')}</div>${o.description ? `<h3 class="mt-4">${t('from_shop')}</h3><p class="muted">${esc(o.description)}</p>` : ''}</div>`;
    }
    if (walk) h += V.reportBlock(o, state);
    h += C.ratingBlock(st);
    h += `<div class="block"><h3>${t('good_to_know')}</h3><p class="small muted">${t('allergen_note')}</p><p class="small muted">${t('bring_bag')}</p><button class="btn ghost" style="padding:0" data-action="safety">${icon('flag')}${t('safety_link')}</button></div>`;
    h += `</div></div>`;
    h += V.ctaBar(o, state);
    return h + `</div>`;
  };

  V.walkinPanel = (o, state) => {
    const s = S();
    let h = `<div class="mode-panel walkin"><div class="hatch-head">${t('walkin_label')}</div><div class="inner">${t('walkin_explain')}<div class="mt-2 bold">${t('published_ago', { a: C.ago(o.publishedAt, s.now) })} · ${t('photo_today', { t: fmt(o.photo.at) })}</div></div></div>`;
    const sig = FTG.walkSignal(o);
    if (state === 'closed') h += C.callout('danger', 'hand', `<b>${t('closed_t')}</b><br>${t('closed_s', { a: C.ago(o.closedAt, s.now) })}`);
    else if (state === 'expired') h += C.callout('info', 'clock', `<b>${t('expired_t')}</b><br>${t('expired_s')}`);
    else if (state === 'review') h += C.callout('danger', 'alert', `<b>${t('review_t')}</b><br>${t('review_s')}`);
    else if (state === 'possiblyGone') h += C.callout('warn', 'alert', `<b>${t('possibly_gone_t')}</b><br>${t('possibly_gone_s', { a: C.ago(sig.last.at, s.now) })}`);
    return h;
  };

  V.reportBlock = (o, state) => {
    const s = S(), mine = s.myReports[o.id];
    const live = !FTG.isGone(state);
    let h = `<div class="block">`;
    if (live) {
      h += `<h3>${t('report_title')}</h3><p class="small muted">${t('report_sub')}</p><div class="report-grid">${['MANY', 'LOW', 'NONE'].map(l => `<button class="report-btn ${mine && mine.lvl === l ? 'on' : ''}" data-action="report" data-arg="${o.id}:${l}" aria-pressed="${!!(mine && mine.lvl === l)}">${icon(l === 'MANY' ? 'crateMany' : l === 'LOW' ? 'crateLow' : 'crateNone')}<span>${t('r_' + l)}</span></button>`).join('')}</div>`;
      if (mine) h += `<p class="small mt-2" style="color:var(--ink-700)">${t('report_yours', { r: t('r_' + mine.lvl), a: C.ago(mine.at, s.now) })}</p>`;
    }
    h += `<h3 class="mt-4">${t('latest_reports')}</h3>`;
    const reps = (o.reports || []).slice().reverse().slice(0, 4);
    if (!reps.length) h += `<p class="small muted">${t('no_reports')}</p>`;
    else h += `<div class="report-list">${reps.map(r => { const stale = s.now - r.at > 45; return `<div class="report-item"><span class="lvl ${r.lvl}"></span><span><b>${t('r_' + r.lvl)}</b> · ${C.ago(r.at, s.now)}<br><span class="muted xs">${r.merchant ? t('merchant_confirmed') : (r.by === 'me' ? t('you') + ' · ' : '') + t('unverified')}${stale ? ' · ' + t('stale') : ''}</span></span></div>`; }).join('')}</div>`;
    h += `</div>`;
    // Optional, separate quality rating
    const q = s.myQuality[o.id] || { val: 0, saved: false };
    h += `<div class="block"><h3>${t('quality_optional_t')}</h3><p class="small muted">${t('quality_optional_s')}</p>${C.starInput('walkStar', o.id, q.val, t('quality_optional_t'))}${q.val && !q.saved ? `<button class="btn secondary sm mt-2" data-action="saveQuality" data-arg="${o.id}">${t('save_rating')}</button>` : ''}${q.saved ? `<p class="small mt-2" style="color:var(--success-700)">${icon('check').replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-3px"')} ${t('quality_saved')}</p>` : ''}</div>`;
    return h;
  };

  V.ctaBar = (o, state) => {
    const s = S(), walk = o.distributionMode === 'WALK_IN', st = FTG.store(o.storeId);
    let h = `<div class="cta-bar">`;
    if (walk) {
      if (FTG.isGone(state)) return h + `<button class="btn block" disabled>${t('cta_ended')}</button>${C.disabledWhy(t('cta_ended_why'))}</div>`;
      return h + `<button class="btn saffron block" data-action="directions">${icon('nav')}${t('directions')}</button>${C.disabledWhy(t('no_reserve_needed'))}</div>`;
    }
    const mine = FTG.myActive();
    if (mine && mine.offerId === o.id) return h + `<button class="btn dark block" data-action="showCode">${icon('qr')}${t('view_my_pickup')}</button></div>`;
    if (FTG.isGone(state)) return h + `<button class="btn block" disabled>${t('cta_ended')}</button>${C.disabledWhy(t('cta_ended_why'))}</div>`;
    if (state === 'soldout' || state === 'stopped') return h + `<button class="btn block" disabled>${t('cta_soldout')}</button>${C.disabledWhy(t('cta_soldout_why'))}${!s.bells.includes(st.id) ? `<button class="btn secondary block mt-2" data-action="toggleBell" data-arg="${st.id}">${icon('bell')}${t('turn_bell_on')}</button>` : ''}</div>`;
    if (mine) return h + `<button class="btn block" disabled>${t('cta_has_active')}</button>${C.disabledWhy(t('cta_has_active_why'))}</div>`;
    return h + `<div class="line"><span class="bold">${t('free')} · ${t('left_n', { n: o.qtyLeft })}</span><span class="muted">${t('today')} ${fmt(o.start)}–${fmt(o.end)}</span></div><button class="btn primary block" data-action="reserve" data-arg="${o.id}">${t('reserve_cta')}</button></div>`;
  };

  // ---------------- Store page ----------------
  V.storePage = (tp) => {
    const s = S(), st = FTG.store(tp.id);
    const offers = FTG.storeOffers(st.id).filter(o => !FTG.isGone(FTG.offerState(o)));
    let h = `<div class="detail"><div class="scroll" data-skey="store-${st.id}"><div class="hero" style="height:200px">${FTG.art(st.art, st.id)}<div class="hero-actions"><button class="back float" data-action="back" aria-label="${t('back')}">${icon('left')}</button></div></div>`;
    h += `<div class="sheet-card"><div style="display:flex;gap:12px;align-items:center">${C.avatar(st, 'lg')}<div><h1 class="h2">${esc(st.name)}</h1><div class="small muted">${st.kind[FTG.lang]} · ${esc(st.address)}</div></div></div><div class="pair mt-4">${C.heartCard(st.id, s.favorites.includes(st.id))}${C.bellCard(st.id, s.bells.includes(st.id))}</div></div><div class="pad" style="padding-bottom:28px">`;
    if (offers.length) h += `<div class="section-title"><h2 class="h3">${t('today')}</h2></div><div class="cards">${offers.map(o => C.offerCard(o, st, FTG.offerState(o), { now: s.now, fav: s.favorites.includes(st.id), lastReport: o.distributionMode === 'WALK_IN' ? FTG.walkSignal(o).last : null })).join('')}</div>`;
    else h += `<div class="block center"><p class="bold">${t('fav_no_offer')}</p><p class="small muted">${t('participating_s')}</p></div>`;
    h += C.ratingBlock(st);
    h += `</div></div></div>`;
    return h;
  };

  // ---------------- Reserved success ----------------
  V.reservedView = (tp) => {
    const r = S().reservations.find(x => x.id === tp.id), o = FTG.offer(r.offerId), st = FTG.store(o.storeId);
    return `<div class="detail"><div class="scroll" data-skey="reserved" style="padding-top:var(--safe-top)"><div class="pad">${C.statusHero('berry', 'check', t('reserved_title'), t('reserved_body', { store: esc(st.name), s: fmt(o.start), e: fmt(o.end) }))}<div class="block"><div class="kv"><span class="k">${t('pickup_code')}</span><span class="v">${r.code}</span></div><div class="kv"><span class="k">${t('pickup_time')}</span><span class="v">${t('today')} ${fmt(o.start)}–${fmt(o.end)}</span></div><div class="kv"><span class="k">${t('address')}</span><span class="v">${esc(st.address)}</span></div><div class="kv"><span class="k">${t('free_s')}</span><span class="v">${t('free')}</span></div></div></div></div><div class="cta-bar"><button class="btn primary block" data-action="showCode">${icon('qr')}${t('show_code')}</button><button class="btn ghost block mt-2" data-action="backToDiscover">${t('back_discover')}</button></div></div>`;
  };

  // ---------------- Pickups ----------------
  V.pickups = () => {
    const s = S(), mine = FTG.myReservations();
    const active = mine.filter(r => r.status === 'confirmed');
    const cancelled = mine.filter(r => r.status === 'cancelled_merchant');
    const past = mine.filter(r => !['confirmed'].includes(r.status));
    let h = `<div class="scroll" data-skey="pickups"><div class="view-pad"><h1 class="h1" style="margin:8px 0 4px">${t('pickups_title')}</h1>`;
    cancelled.filter(r => !r.ack).forEach(r => { const o = FTG.offer(r.offerId); h += C.callout('danger', 'alert', `<b>${t('merchant_cancelled_t')}</b><br>${esc(FTG.store(o.storeId).name)} – ${t('merchant_cancelled_s', { r: t(r.reasonKey) })}`); });
    if (!active.length && !past.length && !s.history.length) {
      h += C.empty({ title: t('no_pickups_t'), body: t('no_pickups_s'), actions: `<button class="btn primary block" data-action="go" data-arg="discover">${t('find_food')}</button>` });
      return h + '</div></div>';
    }
    active.forEach(r => { h += V.ticket(r); });
    if (!active.length) h += `<div class="block center mt-3"><p class="bold">${t('no_pickups_t')}</p><button class="btn secondary mt-2" data-action="go" data-arg="discover">${t('find_food')}</button></div>`;
    h += `<div class="section-title"><h2 class="h3">${t('history')}</h2></div><div class="list">`;
    past.slice().reverse().forEach(r => { const o = FTG.offer(r.offerId), st = FTG.store(o.storeId); h += V.historyRow(st, t('today'), r.status, r, !!r.rated); });
    s.history.forEach(hh => { const st = FTG.store(hh.storeId); h += V.historyRow(st, hh.day, hh.status, hh, hh.rated, hh.walkIn); });
    return h + `</div><div style="height:24px"></div></div></div>`;
  };

  const stKey = { confirmed: 'st_confirmed', collected: 'st_collected', cancelled_user: 'st_cancelled_user', cancelled_merchant: 'st_cancelled_merchant', not_received: 'st_not_received', expired: 'st_expired' };
  const stTone = { collected: 'ok', cancelled_merchant: 'danger', not_received: 'warn', expired: 'ended', cancelled_user: 'ended', confirmed: 'outline' };
  V.historyRow = (st, day, status, rec, rated, walk) => {
    const canRate = status === 'collected' && !rated && !walk;
    return `<div class="row-item">${C.avatar(st, 'sm')}<div class="grow"><span class="t">${esc(st.name)}</span><span class="s">${day} · ${walk ? t('walkin_badge') : t('surprise_bag')}</span></div><div class="r">${canRate ? `<button class="btn primary sm" data-action="openRate" data-arg="${rec.id}">${t('rate_cta')}</button>` : `<span class="badge ${stTone[status] || 'outline'}">${status === 'collected' && rated ? t('rated') : t(stKey[status])}</span>`}</div></div>`;
  };

  V.ticket = (r) => {
    const s = S(), o = FTG.offer(r.offerId), st = FTG.store(o.storeId);
    const open = s.now >= o.start;
    return `<div class="ticket mt-3"><div class="head"><div class="small" style="opacity:.85">${t('active_pickup')}</div><div class="h2">${esc(st.name)}</div><div class="small">${t('today')} ${fmt(o.start)}–${fmt(o.end)} · ${esc(st.address)}</div></div><div class="qr">${FTG.qrSvg(r.code)}<span class="badge outline mt-2">${t('sim_qr')}</span></div><div class="code">${r.code}</div><p class="small muted center pad mt-2">${t('pickup_code_s')}</p><div class="perf"></div><div class="foot">${C.callout(open ? 'ok' : 'info', 'clock', open ? t('pickup_open_now', { t: fmt(o.end) }) : t('pickup_opens', { t: fmt(o.start) }))}<div class="pair mt-3"><button class="btn secondary sm" data-action="directions">${t('directions')}</button><button class="btn danger sm" data-action="cancelRes" data-arg="${r.id}">${t('cancel_reservation')}</button></div>${open ? `<button class="btn ghost block mt-2" data-action="notReceived" data-arg="${r.id}">${icon('alert')}${t('not_received')}</button>` : `<p class="xs muted center mt-2">${t('not_received')}: ${t('pickup_opens', { t: fmt(o.start) }).toLowerCase()}</p>`}<div class="center mt-2"><button class="demo-act" data-action="simScan" data-arg="${r.id}"><b>${t('demo_tag')}</b>${t('demo_scan')}</button></div></div></div>`;
  };

  // ---------------- Rating ----------------
  V.rateView = (tp) => {
    const s = S();
    const rec = s.reservations.find(x => x.id === tp.id) || s.history.find(x => x.id === tp.id);
    const st = FTG.store(rec.storeId || FTG.offer(rec.offerId).storeId);
    const missing = Object.values(tp.vals).some(v => !v);
    let h = `<div class="detail"><div class="scroll" data-skey="rate" style="padding-top:var(--safe-top)"><div class="navbar"><button class="back" data-action="back" aria-label="${t('back')}">${icon('left')}</button><span class="title">${t('rate_title')}</span></div><div class="pad"><div style="display:flex;gap:12px;align-items:center">${C.avatar(st, 'lg')}<div><div class="h2">${esc(st.name)}</div><div class="small muted">${t('surprise_bag')} · ${t('st_collected')}</div></div></div><p class="small muted mt-3">${t('rate_s')}</p><div class="block">`;
    [['quality', 'rate_q_quality'], ['quantity', 'rate_q_quantity'], ['variety', 'rate_q_variety'], ['smoothness', 'rate_q_smoothness']].forEach(([k, l]) => { h += `<div class="rate-row"><div class="bold">${t(l)}</div>${C.starInput('rateStar', k, tp.vals[k], t(l))}</div>`; });
    h += `</div>${C.callout('info', 'shield', `${t('reliability')}: ${t('reliability_s', { ok: st.rel.ok, f: st.rel.fail })}`)}</div></div><div class="cta-bar"><button class="btn primary block" data-action="submitRating" ${missing ? 'aria-disabled="true"' : ''}>${t('submit_rating')}</button>${missing ? C.disabledWhy(t('rate_missing')) : ''}</div></div>`;
    return h;
  };

  // ---------------- Favorites ----------------
  V.favorites = () => {
    const s = S();
    const favs = s.favorites.map(FTG.store), bellsOnly = s.bells.filter(b => !s.favorites.includes(b)).map(FTG.store);
    const nSources = (s.notif.fav ? 1 : 0) + (s.bells.length ? 1 : 0) + (s.notif.radius ? 1 : 0) + s.notif.cities.length;
    let h = `<div class="scroll" data-skey="favorites"><div class="view-pad"><h1 class="h1" style="margin:8px 0 12px">${t('fav_title')}</h1>`;
    h += C.actionCard('openNotif', '', s.notif.permission === 'denied' ? 'bellOff' : 'bellFill', s.notif.permission === 'denied' ? 'saffron' : 'ink', t('alerts_card_t'), s.notif.permission === 'denied' ? t('perm_denied') : (nSources && s.notif.permission === 'granted' ? t('alerts_summary', { n: nSources }) : t('alerts_summary_off')));
    if (!favs.length) {
      h += C.empty({ title: t('fav_empty_t'), body: t('fav_empty_s'), actions: `<button class="btn primary block" data-action="go" data-arg="discover">${t('find_food')}</button>` });
    } else {
      h += `<div class="section-title"><h2 class="h3">${t('fav_title')}</h2><span class="small muted">${favs.length}</span></div><div class="list">${favs.map(st => { const has = FTG.storeOffers(st.id).some(o => !FTG.isGone(FTG.offerState(o))); return V.storeRow(st, has ? `<span style="color:var(--berry-700);font-weight:700">● ${t('fav_has_offer')}</span>` : t('fav_no_offer')); }).join('')}</div>`;
    }
    if (bellsOnly.length) h += `<div class="section-title"><h2 class="h3">${t('n_bell_t')}</h2></div><div class="list">${bellsOnly.map(st => V.storeRow(st)).join('')}</div>`;
    return h + `<div style="height:24px"></div></div></div>`;
  };

  // ---------------- Notification settings ----------------
  V.notifSettings = () => {
    const s = S(), N = s.notif;
    let perm;
    if (N.permission === 'granted') perm = C.callout('ok', 'check', `<b>${t('perm_granted')}</b>`);
    else if (N.permission === 'denied') perm = C.callout('danger', 'bellOff', `<b>${t('perm_denied')}</b><br>${t('perm_denied_s')}<div class="mt-2"><button class="btn dark sm" data-action="openDeviceSettings">${t('open_settings')}</button> <span class="xs">(${t('simulated').toLowerCase()})</span></div>`);
    else perm = C.callout('warn', 'bell', `<b>${t('perm_unknown')}</b><br>${t('perm_unknown_s')}<div class="mt-2"><button class="btn dark sm" data-action="askPush">${t('allow_notifs')}</button></div>`);
    let h = `<div class="detail"><div class="scroll" data-skey="notif" style="padding-top:var(--safe-top)"><div class="navbar"><button class="back" data-action="back" aria-label="${t('back')}">${icon('left')}</button><span class="title">${t('notif_title')}</span></div><div class="pad" style="padding-bottom:32px">${perm}`;
    h += `<div class="section-title"><h2 class="h3">${t('notif_sources')}</h2></div><div class="block" style="padding-top:4px;padding-bottom:4px">`;
    h += C.switchRow('notifToggle', N.fav, t('n_fav_t'), t('n_fav_s', { n: s.favorites.length }), 'fav');
    h += `<div class="switch-row"><div class="grow"><span class="t">${t('n_bell_t')}</span><span class="s">${t('n_bell_s', { n: s.bells.length })}</span></div><button class="btn secondary sm" data-action="openBells">${t('n_bell_manage')}</button></div>`;
    h += C.switchRow('notifToggle', N.radius, t('n_radius_t'), t('n_radius_s', { km: N.radiusKm, p: `${t('saved_place_home')} (${t('saved_place_addr')})` }), 'radius');
    if (N.radius) h += `<div class="sub-block"><div class="range-head"><span>1 km</span><span>${N.radiusKm} km</span><span>20 km</span></div><input type="range" min="1" max="20" value="${N.radiusKm}" data-input="notifRadius" aria-label="${t('loc_radius')}"><div class="mini-map">${FTG.mapSvg([], { h: 132, home: true, radius: 8 + N.radiusKm * 6 })}</div></div>`;
    h += `<div class="switch-row" style="display:block"><span class="t bold">${t('n_city_t')}</span><span class="s small muted" style="display:block">${t('n_city_s')}</span><div class="tags mt-2">${N.cities.map(c => `<button class="chip on" data-action="toggleCityAlert" data-arg="${c}" aria-label="${FTG.city(c).name} – ${t('m_remove')}">${icon('city').replace('<svg', '<svg style="width:16px;height:16px"')}${FTG.city(c).name}${icon('x').replace('<svg', '<svg style="width:14px;height:14px"')}</button>`).join('')}<button class="chip" data-action="addCity">${icon('plus').replace('<svg', '<svg style="width:16px;height:16px"')}${t('add_city')}</button></div></div>`;
    h += `</div><div class="block" style="padding-top:4px;padding-bottom:4px">${C.switchRow('notifToggle', N.quiet, t('quiet_t'), t('quiet_s', { s: N.quietS, e: N.quietE }), 'quiet')}${N.quiet ? `<div class="sub-block time-pair"><div><label for="qs">${t('m_start')}</label><input id="qs" class="input" type="time" value="${N.quietS}" data-input="quietS"></div><div><label for="qe">${t('m_end')}</label><input id="qe" class="input" type="time" value="${N.quietE}" data-input="quietE"></div></div>` : ''}</div>`;
    h += `<div class="section-title"><h2 class="h3">${t('other_notifs')}</h2></div><div class="block" style="padding-top:4px;padding-bottom:4px">${C.switchRow('notifToggle', N.remind, t('remind_t'), t('remind_s'), 'remind')}<div class="switch-row"><div class="grow"><span class="t">${t('cancel_alert_t')}</span><span class="s">${t('cancel_alert_s')}</span></div>${icon('lock')}</div></div>`;
    h += `<div class="block"><h3>${t('how_alerts')}</h3><ul class="small" style="margin:0;padding-left:18px;color:var(--ink-700)"><li>${t('how_alerts_1')}</li><li>${t('how_alerts_2')}</li><li>${t('how_alerts_3')}</li></ul></div>`;
    return h + `</div></div></div>`;
  };

  V.bellsView = () => {
    const s = S();
    const cities = new Set([s.location.city || 'tampere'].concat(s.notif.cities));
    const stores = s.stores.filter(x => cities.has(x.city));
    return `<div class="detail"><div class="scroll" data-skey="bells" style="padding-top:var(--safe-top)"><div class="navbar"><button class="back" data-action="back" aria-label="${t('back')}">${icon('left')}</button><span class="title">${t('n_bell_t')}</span></div><div class="pad"><p class="small muted">${t('participating_s')}</p><div class="list">${stores.map(st => V.storeRow(st, `${st.kind[FTG.lang]} · ${FTG.city(st.city).name}`)).join('')}</div></div></div></div>`;
  };

  // ---------------- Profile ----------------
  V.profile = () => {
    const s = S(), m = FTG.store(FTG.MERCHANT_STORE_ID);
    let h = `<div class="scroll" data-skey="profile"><div class="view-pad"><h1 class="h1" style="margin:8px 0 12px">${t('profile_title')}</h1>`;
    h += `<div class="block" style="display:flex;gap:14px;align-items:center;margin-top:0"><span class="avatar lg" style="background:var(--active);color:var(--onActive);border-color:var(--active)">AK</span><div style="flex:1"><div class="h3">Aino K.</div><div class="small muted">aino.k@example.fi</div></div><div class="center"><div class="score-big" style="font-size:32px;color:var(--berry-600)">${s.impact}</div><div class="xs muted">${t('saved_impact')}</div></div></div>`;
    h += `<div class="section-title"><h2 class="h3">${t('roles')}</h2></div><div class="list">`;
    [['collector', t('role_collector'), t('role_collector_s'), 'bag'], ['merchant', t('role_merchant'), t('role_merchant_s', { store: m.name }), 'store']].forEach(([r, ti, sub, ic]) => {
      const on = s.role === r;
      h += `<div class="row-item"><span class="ic" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:${on ? 'var(--berry-100)' : 'var(--ink-100)'};color:${on ? 'var(--berry-700)' : 'var(--ink-700)'}">${icon(ic)}</span><div class="grow"><span class="t">${ti}</span><span class="s">${esc(sub)}</span></div><div class="r">${on ? `<span class="badge ok">${t('active_role')}</span>` : `<button class="btn secondary sm" data-action="setRole" data-arg="${r}">${t('use_role')}</button>`}</div></div>`;
    });
    h += `</div><div class="list mt-4">`;
    [['openNotif', '', 'bell', t('p_alerts')], ['openLocation', '', 'pin', t('p_location')], ['openSheet', 'theme', 'sliders', `${t('theme_title')} · ${t('theme_n', { n: FTG.theme.current })} ${FTG.theme.THEMES[FTG.theme.current].name}`], ['openSheet', 'lang', 'globe', `${t('p_language')} · ${FTG.lang ? 'English' : 'Suomi'}`], ['openSheet', 'privacy', 'lock', t('p_privacy')], ['openSheet', 'help', 'help', t('p_help')]].forEach(([a, arg, ic, ti]) => { h += `<button class="row-item" data-action="${a}" data-arg="${arg}">${icon(ic)}<span class="grow t">${ti}</span>${icon('right')}</button>`; });
    return h + `</div><p class="xs muted center mt-6">Free To Go · Stage One HTML mockup</p></div></div>`;
  };

  // ---------------- Push banner ----------------
  V.push = (p) => `<button class="push" data-action="openPush" aria-label="${esc(p.title)}">${FTG.appIcon(38)}<span style="flex:1;min-width:0"><span class="meta"><span>FREE TO GO</span><span>${t('now_lbl')}</span></span><span class="t" style="display:block">${esc(p.title)}</span><span class="s" style="display:block">${esc(p.body)}</span><span class="sim">${t('sim_push')}</span></span></button>`;

  // ---------------- Dialogs ----------------
  V.dialogs = {
    gps: () => C.osDialog(t('gps_dialog_t'), t('gps_dialog_s'), [{ label: t('gps_allow_once'), action: 'gpsAllow' }, { label: t('gps_allow_using'), action: 'gpsAllow', bold: true }, { label: t('gps_deny'), action: 'gpsDeny' }]),
    push: () => C.osDialog(t('push_dialog_t'), t('push_dialog_s'), [{ label: t('dont_allow'), action: 'pushDeny' }, { label: t('allow'), action: 'pushAllow', bold: true }]),
  };

  // ---------------- Sheets ----------------
  V.sheets = {
    location: (sh) => {
      const s = S(), L = s.location;
      let b = '';
      if (L.gps === 'denied') b += C.callout('warn', 'nav', `<b>${t('loc_denied_title')}</b><br>${t('loc_denied_body')}`);
      else b += `<button class="action-card mt-2" data-action="useGps"><span class="ic berry">${icon('nav')}</span><span><span class="t">${t('loc_use_gps')}</span><span class="s">${t('loc_use_gps_s')}</span></span></button>`;
      b += `<div class="section-title"><h3 class="h3">${t('loc_pick_city')}</h3></div><div class="list" style="border:1px solid var(--ink-100)">${FTG.CITIES.map(c => { const on = L.mode !== 'unset' && L.city === c.id; return `<button class="row-item" data-action="pickCity" data-arg="${c.id}" aria-pressed="${on}">${icon('city')}<span class="grow t">${c.name}</span>${on ? `<span style="color:var(--berry-600)">${icon('check')}</span>` : ''}</button>`; }).join('')}</div>`;
      b += `<div class="field"><div class="range-head"><span>${t('loc_radius')}</span><span>${L.km} km</span></div><input type="range" min="1" max="20" value="${L.km}" data-input="locRadius" aria-label="${t('loc_radius')}"></div>`;
      b += `<div class="btns"><button class="btn primary block" data-action="locDone">${t('loc_done')}</button></div>`;
      return C.sheet(t('loc_sheet_title'), b);
    },
    filters: () => {
      const D = S().discover;
      let b = `<div class="field"><span class="lbl">${t('m_groups')}</span><div class="checks">${FTG.CATEGORIES.map(c => `<button class="check ${D.cats.includes(c) ? 'on' : ''}" data-action="filterCat" data-arg="${c}" aria-pressed="${D.cats.includes(c)}"><span class="box">${icon('check')}</span>${FTG.cat(c)}</button>`).join('')}</div></div>`;
      b += `<div class="field"><span class="lbl">${t('pickup_time')}</span><div class="seg">${[['any', t('mode_all')], ['now', t('when_now')], ['later', t('when_later')]].map(([w, l]) => `<button class="${D.when === w ? 'on' : ''}" data-action="filterWhen" data-arg="${w}">${l}</button>`).join('')}</div></div>`;
      b += `<div class="field"><span class="lbl">${FTG.lang ? 'Sort' : 'Järjestys'}</span><div class="tags">${[['distance', FTG.lang ? 'Distance' : 'Etäisyys'], ['time', t('pickup_time')], ['rating', t('ratings_title')]].map(([k, l]) => `<button class="chip ${D.sort === k ? 'on' : ''}" data-action="filterSort" data-arg="${k}">${l}</button>`).join('')}</div></div>`;
      b += `<div class="field">${C.switchRow('filterSold', D.showSold, t('sold_out_title'), FTG.lang ? 'Show fully reserved offers' : 'Näytä loppuunvaratut tarjoukset')}</div>`;
      b += `<div class="btns"><button class="btn primary block" data-action="closeSheet">${t('results_n', { n: FTG.discoverOffers().length })}</button><button class="btn ghost block" data-action="clearFilters">${t('clear_filters')}</button></div>`;
      return C.sheet(t('filters'), b);
    },
    confirmReserve: (sh) => {
      const o = FTG.offer(sh.id), st = FTG.store(o.storeId);
      return C.sheet(t('confirm_title'), `<div class="block flat" style="background:var(--bg)"><div class="kv"><span class="k">${esc(st.name)}</span><span class="v">${t('surprise_bag')}</span></div><div class="kv"><span class="k">${t('pickup_time')}</span><span class="v">${t('today')} ${fmt(o.start)}–${fmt(o.end)}</span></div><div class="kv"><span class="k">${t('free_s')}</span><span class="v">${t('free')}</span></div></div><p class="small muted mt-3">${t('confirm_body')}</p><div class="btns"><button class="btn primary block" data-action="confirmReserve" data-arg="${o.id}">${t('confirm_btn')}</button><button class="btn ghost block" data-action="closeSheet">${t('cancel')}</button></div>`);
    },
    checking: () => `<div class="overlay"><div class="sheet center" style="padding:32px 16px 40px"><div class="spinner"></div><h2 class="h2 mt-4">${t('checking')}</h2><p class="muted">${t('checking_s')}</p></div></div>`,
    race: (sh) => { const o = FTG.offer(sh.id); return C.sheet(t('race_title'), `${C.statusHero('warn', 'alert', '', t('race_body'))}<div class="btns">${!S().bells.includes(o.storeId) ? `<button class="btn dark block" data-action="toggleBell" data-arg="${o.storeId}">${icon('bell')}${t('turn_bell_on')}</button>` : ''}<button class="btn secondary block" data-action="backToDiscover">${t('back_discover')}</button></div>`); },
    gone: () => C.sheet(t('offer_gone_title'), `${C.statusHero('warn', 'clock', '', t('offer_gone_body'))}<div class="btns"><button class="btn primary block" data-action="backToDiscover">${t('back_discover')}</button></div>`),
    cancelRes: (sh) => C.sheet(t('cancel_confirm_t'), `<p class="muted">${t('cancel_confirm_s')}</p><div class="btns"><button class="btn danger-solid block" data-action="doCancelRes" data-arg="${sh.id}">${t('yes_cancel')}</button><button class="btn secondary block" data-action="closeSheet">${t('keep_reservation')}</button></div>`),
    notReceived: (sh) => {
      let b = `<p class="muted">${t('not_received_s')}</p><div class="list" style="border:1px solid var(--ink-100)">${[['out', 'nr_out'], ['closed', 'nr_closed'], ['other', 'nr_other']].map(([k, l]) => `<button class="row-item" data-action="nrReason" data-arg="${k}" role="radio" aria-checked="${sh.reason === k}"><span class="grow t">${t(l)}</span><span style="width:24px;height:24px;border-radius:50%;border:2px solid ${sh.reason === k ? 'var(--berry-600)' : 'var(--ink-300)'};display:grid;place-items:center">${sh.reason === k ? '<i style="width:12px;height:12px;border-radius:50%;background:var(--berry-600)"></i>' : ''}</span></button>`).join('')}</div>`;
      if (sh.reason === 'other') b += `<div class="field"><textarea class="input" placeholder="${t('nr_other_ph')}" data-input="nrText" data-fkey="nrText">${esc(sh.text)}</textarea></div>`;
      b += `<div class="btns"><button class="btn primary block" data-action="nrSend" ${sh.reason ? '' : 'disabled'}>${t('send_report')}</button>${sh.reason ? '' : C.disabledWhy(FTG.lang ? 'Choose a reason first.' : 'Valitse ensin syy.')}</div>`;
      return C.sheet(t('not_received_t'), b);
    },
    nrSent: () => C.sheet(t('nr_sent_t'), `${C.statusHero('ok', 'check', '', t('nr_sent_s'))}<div class="btns"><button class="btn primary block" data-action="closeSheet">${t('done')}</button></div>`),
    collected: (sh) => C.sheet(t('collected_t'), `${C.statusHero('ok', 'check', '', t('collected_s'))}<div class="btns"><button class="btn primary block" data-action="openRate" data-arg="${sh.id}">${icon('star')}${t('rate_now')}</button><button class="btn ghost block" data-action="closeSheet">${t('later')}</button></div>`),
    safety: (sh) => C.sheet(t('safety_t'), `<p class="muted small">${t('safety_s')}</p><div class="list" style="border:1px solid var(--ink-100)">${[['spoiled', 'sf_spoiled'], ['allergen', 'sf_allergen'], ['other', 'sf_other']].map(([k, l]) => `<button class="row-item" data-action="safetyKind" data-arg="${k}" role="radio" aria-checked="${sh.kind === k}"><span class="grow t">${t(l)}</span>${sh.kind === k ? `<span style="color:var(--berry-600)">${icon('check')}</span>` : ''}</button>`).join('')}</div>${C.callout('danger', 'alert', t('safety_urgent'))}<div class="btns"><button class="btn primary block" data-action="safetySend" ${sh.kind ? '' : 'disabled'}>${t('send_report')}</button>${sh.kind ? '' : C.disabledWhy(FTG.lang ? 'Choose what happened first.' : 'Valitse ensin, mitä tapahtui.')}</div>`),
    addCity: () => { const s = S(); return C.sheet(t('add_city'), `<div class="list" style="border:1px solid var(--ink-100)">${FTG.CITIES.map(c => { const on = s.notif.cities.includes(c.id); return `<button class="row-item" data-action="toggleCityAlert" data-arg="${c.id}" aria-pressed="${on}">${icon('city')}<span class="grow t">${c.name}</span><span class="check ${on ? 'on' : ''}" style="border:0;padding:0;min-height:0;background:none"><span class="box">${icon('check')}</span></span></button>`; }).join('')}</div><p class="small muted mt-3">${t('n_city_s')}</p><div class="btns"><button class="btn primary block" data-action="closeSheet">${t('done')}</button></div>`); },
    lang: () => C.sheet(t('p_language'), `<div class="list" style="border:1px solid var(--ink-100)">${[['0', 'Suomi'], ['1', 'English']].map(([i, l]) => `<button class="row-item" data-action="setLang" data-arg="${i}"><span class="grow t">${l}</span>${+i === FTG.lang ? `<span style="color:var(--berry-600)">${icon('check')}</span>` : ''}</button>`).join('')}</div><p class="small muted mt-3">${FTG.lang ? 'More languages can be added without changing screens.' : 'Lisää kieliä voidaan lisätä muuttamatta näkymiä.'}</p>`),
    theme: () => C.sheet(t('theme_title'), `<p class="muted small">${t('theme_s')}</p>${Object.entries(FTG.theme.THEMES).map(([id, th]) => `<button class="theme-opt ${FTG.theme.current === id ? 'on' : ''}" data-action="setTheme" data-arg="${id}" aria-pressed="${FTG.theme.current === id}"><span class="sw" style="background:${th.primary}"></span><span><span class="t">${t('theme_n', { n: id })} · ${th.name}</span><span class="s">${th.primary}</span></span>${FTG.theme.current === id ? `<span class="ck">${icon('check')}</span>` : ''}</button>`).join('')}<div class="btns"><button class="btn primary block" data-action="closeSheet">${t('done')}</button></div>`),
    privacy: () => C.sheet(t('p_privacy'), `<p class="muted">${t('privacy_body')}</p><div class="btns"><button class="btn primary block" data-action="closeSheet">${t('close')}</button></div>`),
    help: () => C.sheet(t('p_help'), `<p class="muted">${t('help_body')}</p><div class="btns"><button class="btn primary block" data-action="closeSheet">${t('close')}</button></div>`),
  };
})();

</script>
  <script>
/* Free To Go — merchant role (same app, role switch). Areas: Publish, Manage (listings + pickups), Store. */
(function () {
  const t = FTG.t, C = FTG.C, icon = FTG.icon, esc = C.esc, fmt = C.fmt;
  const MV = FTG.MV = {}, MA = FTG.MA = {}, MI = FTG.MI = {};
  const S = () => FTG.state();
  const me = () => FTG.store(FTG.MERCHANT_STORE_ID);
  const mine = () => S().offers.filter(o => o.storeId === FTG.MERCHANT_STORE_ID);

  MV.tabbar = () => {
    const s = S(), n = mine().filter(o => !FTG.isGone(FTG.offerState(o))).length;
    const tabs = [['publish', 'plus', 'tab_publish'], ['manage', 'list', 'tab_manage'], ['store', 'store', 'tab_store']];
    return `<nav class="tabbar">${tabs.map(([id, ic, l]) => `<button class="tab ${s.mTab === id ? 'on' : ''}" data-action="go" data-arg="${id}" aria-current="${s.mTab === id ? 'page' : 'false'}">${icon(ic)}<span>${t(l)}</span>${id === 'manage' && n ? `<span class="dot">${n}</span>` : ''}</button>`).join('')}</nav>`;
  };

  MV.header = () => { const st = me(); return `<div class="topbar"><div class="loc-chip" style="cursor:default">${C.avatar(st, 'sm')}<span style="min-width:0"><span class="t" style="font-size:20px">${esc(st.name)}</span><span class="sub">${t('m_mode')}</span></span></div><button class="role-pill merchant" data-action="switchRole">${icon('swap').replace('<svg', '<svg style="width:16px;height:16px"')}${t('switch_to_collector')}</button></div>`; };

  MV.main = () => ({ publish: MV.publish, manage: MV.manage, store: MV.storeTab }[S().mTab])();

  MV.stackView = (tp) => ({ mOffer: MV.offerManage, offer: FTG.V.offerDetail, store: FTG.V.storePage }[tp.view])(tp);

  // ---------------- Publish ----------------
  MV.publish = () => {
    const s = S();
    if (s.published) return MV.published();
    if (s.draft) return MV.form();
    const R = FTG.TEMPLATES.reserved, W = FTG.TEMPLATES.walkin;
    let h = `<div class="scroll" data-skey="m-publish">${MV.header()}<div class="view-pad"><h1 class="h1 mt-3">${t('m_publish_title')}</h1>`;
    h += `<div class="section-title"><h2 class="h3">${t('m_repeat_t')}</h2></div><p class="small muted">${t('m_repeat_s')}</p><div class="cards">`;
    h += `<div class="block" style="margin:0;display:flex;gap:12px;align-items:center"><span class="badge reserve" style="height:44px;width:44px;justify-content:center;padding:0">${icon('repeat')}</span><div style="flex:1;min-width:0"><div class="bold">${R.qty} × ${t('surprise_bag').toLowerCase()} · ${R.start}–${R.end}</div><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${R.categories.map(FTG.cat).join(', ')}</div></div><button class="btn primary sm" data-action="mNewDraft" data-arg="tplR">${t('m_use_template')}</button></div>`;
    h += `<div class="block" style="margin:0;display:flex;gap:12px;align-items:center"><span class="badge walkin" style="height:44px;width:44px;justify-content:center;padding:0">${icon('repeat')}</span><div style="flex:1;min-width:0"><div class="bold">${t('walkin_badge')} · ${W.start}–${W.end}</div><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(W.what)}</div></div><button class="btn dark sm" data-action="mNewDraft" data-arg="tplW">${t('m_use_template')}</button></div></div>`;
    h += `<div class="section-title"><h2 class="h3">${t('m_new')}</h2></div><div class="mode-pick">`;
    h += `<button class="mode-card" data-action="mNewDraft" data-arg="RESERVED"><div class="top"></div><div class="in"><span class="t">${t('m_mode_reserved_t')}</span><span class="s">${t('m_mode_reserved_s')}</span><ul><li>${t('m_mode_reserved_l1')}</li><li>${t('m_mode_reserved_l2')}</li></ul></div></button>`;
    h += `<button class="mode-card walkin" data-action="mNewDraft" data-arg="WALK_IN"><div class="top"></div><div class="in"><span class="t">${t('m_mode_walkin_t')}</span><span class="s">${t('m_mode_walkin_s')}</span><ul><li>${t('m_mode_walkin_l1')}</li><li>${t('m_mode_walkin_l2')}</li></ul></div></button>`;
    return h + `</div><div style="height:24px"></div></div></div>`;
  };

  const validate = (d) => {
    const e = [], s = S();
    const st = C.parseT(d.start), en = C.parseT(d.end);
    if (d.mode === 'RESERVED' && !d.categories.length) e.push('m_need_groups');
    if (d.mode === 'WALK_IN' && !(d.photo && d.photo.kind === 'current')) e.push('m_need_photo');
    if (d.mode === 'WALK_IN' && !d.what.trim()) e.push('m_need_what');
    if (!(en > st && en > s.now)) e.push('m_need_time');
    return e;
  };

  MV.form = () => {
    const s = S(), d = s.draft, walk = d.mode === 'WALK_IN', errs = validate(d);
    let h = `<div class="scroll" data-skey="m-form" style="padding-top:var(--safe-top)"><div class="navbar"><button class="back" data-action="mDiscard" aria-label="${t('back')}">${icon('left')}</button><span class="title">${t(walk ? 'm_form_walkin' : 'm_form_reserved')}</span>${d.fromTemplate ? `<span class="timer" style="margin-right:8px">${icon('clock').replace('<svg', '<svg style="width:14px;height:14px"')}${FTG.lang ? 'Target' : 'Tavoite'} 20 s</span>` : ''}</div><div class="pad" style="padding-bottom:28px">`;
    h += `<div style="height:6px;border-radius:3px;background:${walk ? 'var(--hatch)' : 'var(--berry-600)'}"></div>`;
    if (d.fromTemplate) h += C.callout('berry', 'repeat', t('m_check_banner'));
    if (walk) h += C.callout('warn', 'alert', `<b>${t('walkin_label')}</b>`);

    if (!walk) h += `<div class="field"><span class="lbl">${t('m_bags')}</span><p class="hint">${t('m_bags_hint')}</p><div class="stepper"><button data-action="mQty" data-arg="-1" aria-label="-1">${icon('minus')}</button><span class="val" aria-live="polite">${d.qty}</span><button data-action="mQty" data-arg="1" aria-label="+1">${icon('plus')}</button></div></div>`;

    if (walk) {
      h += `<div class="field"><span class="lbl">${t('m_photo')} *</span><p class="hint">${t('m_photo_req')}</p>${d.photo ? `<div class="photo-slot">${FTG.art(d.photo.art, 'draft')}<span class="photo-tag">${icon('camera')}${t('photo_today', { t: fmt(d.photo.at) })}</span><button class="btn secondary sm retake" data-action="mTakePhoto">${icon('camera')}${t('m_retake')}</button></div>` : `<button class="btn dark block" style="min-height:120px;flex-direction:column;border-radius:16px" data-action="mTakePhoto">${icon('camera').replace('<svg', '<svg style="width:32px;height:32px"')}${t('m_take_photo_now')}</button>`}</div>`;
      h += `<div class="field"><label for="what">${t('m_what')} *</label><textarea id="what" class="input" placeholder="${t('m_what_ph')}" data-input="mWhat" data-fkey="mWhat" maxlength="140">${esc(d.what)}</textarea></div>`;
    }

    h += `<div class="field"><span class="lbl">${t('m_groups')}${walk ? '' : ' *'}</span><p class="hint">${walk ? t('m_groups_walkin_hint') : t('m_groups_hint')}</p><div class="checks" role="group">${FTG.CATEGORIES.map(c => `<button class="check ${d.categories.includes(c) ? 'on' : ''}" data-action="mCat" data-arg="${c}" role="checkbox" aria-checked="${d.categories.includes(c)}"><span class="box">${icon('check')}</span>${FTG.cat(c)}</button>`).join('')}</div></div>`;

    h += `<div class="field"><span class="lbl">${t('m_time')} *</span><div class="time-pair"><div><label for="ts">${t('m_start')}</label><input id="ts" class="input" type="time" value="${d.start}" data-input="mStart"></div><div><label for="te">${t('m_end')}</label><input id="te" class="input" type="time" value="${d.end}" data-input="mEnd"></div></div>${walk ? `<p class="hint mt-2">${t('m_expiry_note')}</p>` : ''}</div>`;

    if (!walk) {
      h += `<div class="field"><span class="lbl">${t('m_photo')}</span><p class="hint">${t('m_photo_opt')}</p>`;
      if (d.photo) h += `<div class="photo-slot">${FTG.art(d.photo.art, 'draft')}<span class="photo-tag ${d.photo.kind === 'example' ? 'example' : ''}">${d.photo.kind === 'example' ? icon('info') + t('photo_example') : icon('camera') + t('photo_today', { t: fmt(d.photo.at) })}</span><button class="btn secondary sm retake" data-action="mRemovePhoto">${t('m_remove')}</button></div>`;
      else h += `<div class="pair"><button class="btn secondary" data-action="mTakePhoto">${icon('camera')}${t('m_take_photo')}</button><button class="btn secondary" data-action="mExample">${t('m_use_example')}</button></div><p class="hint mt-2">${t('m_example_note')}</p>`;
      h += `</div><div class="field"><label for="desc">${t('m_desc')} <span class="muted" style="font-weight:500">· ${t('m_desc_opt')}</span></label><textarea id="desc" class="input" placeholder="${t('m_desc_ph')}" data-input="mDesc" data-fkey="mDesc" maxlength="140">${esc(d.description)}</textarea></div>`;
    }

    // Preview
    const pv = MV.draftOffer(d, true);
    h += `<div class="section-title"><h2 class="h3">${t('m_preview')}</h2></div>${C.offerCard(pv, me(), 'active', { now: s.now, fav: false, lastReport: null }).replace('data-action="openOffer"', 'data-action="noop"')}`;
    h += `</div></div><div class="cta-bar" style="padding-bottom:18px">${errs.length ? `<button class="btn block" disabled>${walk ? t('m_publish_walkin') : t('m_publish_n', { n: d.qty })}</button>${errs.map(k => C.disabledWhy(t(k))).join('')}` : `<button class="btn ${walk ? 'saffron' : 'primary'} block" data-action="mPublish">${walk ? t('m_publish_walkin') : t('m_publish_n', { n: d.qty })}</button>`}</div>`;
    return h;
  };

  MV.draftOffer = (d, preview) => {
    const s = S(), start = C.parseT(d.start), end = C.parseT(d.end);
    const base = { storeId: FTG.MERCHANT_STORE_ID, distributionMode: d.mode, categories: d.categories.slice(), start, end, publishedAt: s.now, photo: d.photo ? Object.assign({}, d.photo) : { kind: 'none' }, description: d.description };
    if (d.mode === 'RESERVED') Object.assign(base, { qtyTotal: d.qty, qtyLeft: d.qty });
    else Object.assign(base, { what: d.what || t('m_what_ph'), expiresAt: Math.min(end, Math.max(s.now, start) + 60), reports: [] });
    if (preview) base.id = 'preview';
    return FTG.makeOffer(base);
  };

  MV.published = () => {
    const s = S(), p = s.published, o = FTG.offer(p.id);
    let h = `<div class="scroll" data-skey="m-published">${MV.header()}<div class="view-pad">${C.statusHero('ok', 'check', t('m_published'), '')}<div class="center"><span class="timer">${icon('clock').replace('<svg', '<svg style="width:14px;height:14px"')}${t('m_published_in', { n: p.secs })}</span></div>`;
    h += `<div class="mt-4">${C.offerCard(o, me(), FTG.offerState(o), { now: s.now, fav: false, lastReport: null }).replace('data-action="openOffer"', 'data-action="mOpen"')}</div>${C.callout('ok', 'bell', t('m_auto_notify'))}`;
    h += `<div class="btns" style="display:grid;gap:10px;margin-top:20px"><button class="btn primary block" data-action="mGoManage" data-arg="${o.id}">${t('m_go_manage')}</button><button class="btn secondary block" data-action="mAnother">${t('m_publish_another')}</button></div>`;
    return h + `</div></div>`;
  };

  // ---------------- Manage ----------------
  MV.manage = () => {
    const s = S(), list = mine();
    const active = list.filter(o => !FTG.isGone(FTG.offerState(o))), past = list.filter(o => FTG.isGone(FTG.offerState(o)));
    let h = `<div class="scroll" data-skey="m-manage">${MV.header()}<div class="view-pad"><h1 class="h1 mt-3">${t('tab_manage')}</h1>`;
    if (!active.length) h += C.empty({ title: t('m_none_active_t'), body: t('m_none_active_s'), actions: `<button class="btn primary block" data-action="go" data-arg="publish">${icon('plus')}${t('tab_publish')}</button>` });
    else h += `<div class="section-title"><h2 class="h3">${t('m_active')}</h2></div><div class="cards">${active.map(MV.manageCard).join('')}</div>`;
    if (past.length) h += `<div class="section-title"><h2 class="h3">${t('m_past')}</h2></div><div class="cards">${past.map(MV.manageCard).join('')}</div>`;
    return h + `<div style="height:24px"></div></div></div>`;
  };

  MV.manageCard = (o) => {
    const s = S(), st = FTG.offerState(o), walk = o.distributionMode === 'WALK_IN';
    const res = s.reservations.filter(r => r.offerId === o.id && !['cancelled_user', 'cancelled_merchant'].includes(r.status));
    let body;
    if (walk) {
      const sig = FTG.walkSignal(o);
      body = `<div class="small">${FTG.isGone(st) ? '' : t('m_expires_in', { n: Math.max(0, o.expiresAt - s.now) })}</div>${sig.last ? `<div class="small muted">${t('latest_report', { r: t('r_' + sig.last.lvl), a: C.ago(sig.last.at, s.now) })}</div>` : ''}`;
    } else {
      body = `<div class="between small bold"><span>${t('m_reserved_of', { r: o.qtyTotal - o.qtyLeft, t: o.qtyTotal })}</span><span class="muted">${t('m_collected_n', { n: res.filter(r => r.status === 'collected').length })}</span></div><div class="progress mt-2"><i style="width:${((o.qtyTotal - o.qtyLeft) / o.qtyTotal) * 100}%"></i></div>`;
    }
    return `<article class="card" data-action="mOpen" data-arg="${o.id}" role="link" tabindex="0">${walk ? `<div class="walkin-strip"><span>${t('walkin_label')}</span></div>` : `<div style="height:8px;background:var(--berry-600)"></div>`}<div class="card-body"><div class="between"><div class="gap-row">${C.modeBadge(o)}${C.statusBadge(o, st)}</div><span class="small bold">${fmt(o.start)}–${fmt(o.end)}</span></div><p class="name mt-2">${esc(walk ? o.what : o.categories.map(FTG.cat).join(', '))}</p><div class="mt-2">${body}</div></div></article>`;
  };

  MV.offerManage = (tp) => {
    const s = S(), o = FTG.offer(tp.id), st = FTG.offerState(o), walk = o.distributionMode === 'WALK_IN', gone = FTG.isGone(st);
    let h = `<div class="detail"><div class="scroll" data-skey="m-offer-${o.id}" style="padding-top:var(--safe-top)"><div class="navbar"><button class="back" data-action="back" aria-label="${t('back')}">${icon('left')}</button><span class="title">${walk ? t('m_form_walkin') : t('m_form_reserved')}</span></div><div class="pad" style="padding-bottom:28px">`;
    h += `<div class="gap-row">${C.modeBadge(o)}${C.statusBadge(o, st)}<span class="badge outline">${icon('clock')}${fmt(o.start)}–${fmt(o.end)}</span></div><h2 class="h2 mt-3">${esc(walk ? o.what : o.categories.map(FTG.cat).join(', '))}</h2>`;
    if (walk) {
      const sig = FTG.walkSignal(o);
      if (!gone) {
        if (st === 'review' || st === 'possiblyGone') {
          const n = new Set(o.reports.filter(r => r.lvl === 'NONE' && !r.merchant).map(r => r.by)).size;
          h += `<div class="callout danger">${icon('alert')}<div><b>${t('m_review_prompt_t')}</b><br>${t('m_review_prompt_s', { n })}<div class="pair mt-3"><button class="btn dark sm" data-action="mAllGone" data-arg="${o.id}">${t('m_all_gone')}</button><button class="btn secondary sm" data-action="mStillFood" data-arg="${o.id}">${t('m_still_food')}</button></div></div></div>`;
        }
        h += `<div class="mt-4"><button class="big-stop" data-action="mAllGone" data-arg="${o.id}">${icon('hand')}${t('m_all_gone')}</button><p class="small muted center mt-2">${t('m_all_gone_s')}</p></div>`;
        h += `<div class="block between"><div><div class="bold">${t('m_expires_in', { n: Math.max(0, o.expiresAt - s.now) })}</div><div class="small muted">${FTG.lang ? 'Pilot proposal: 60 min max, +30 min extensions' : 'Pilottiehdotus: enintään 60 min, jatko +30 min'}</div></div><button class="btn secondary sm" data-action="mExtend" data-arg="${o.id}">${t('m_extend')}</button></div>`;
      } else h += C.callout('info', 'check', st === 'closed' ? t('closed_t') : t('expired_t'));
      h += `<div class="block"><h3>${t('m_reports')}</h3>${o.reports.length ? `<div class="report-list">${o.reports.slice().reverse().map(r => `<div class="report-item"><span class="lvl ${r.lvl}"></span><span><b>${t('r_' + r.lvl)}</b> · ${C.ago(r.at, s.now)}<br><span class="xs muted">${r.merchant ? t('merchant_confirmed') : t('unverified')}</span></span></div>`).join('')}</div>` : `<p class="small muted">${t('m_reports_none')}</p>`}</div>`;
    } else {
      const res = s.reservations.filter(r => r.offerId === o.id);
      const open = res.filter(r => r.status === 'confirmed');
      h += `<div class="block"><div class="between bold"><span>${t('m_reserved_of', { r: o.qtyTotal - o.qtyLeft, t: o.qtyTotal })}</span><span class="muted small">${t('m_free_n', { n: o.qtyLeft })}</span></div><div class="progress mt-2"><i style="width:${((o.qtyTotal - o.qtyLeft) / o.qtyTotal) * 100}%"></i></div></div>`;
      if (!gone) h += `<button class="btn primary block mt-3" data-action="mScan" data-arg="${o.id}">${icon('qr')}${t('m_scan')}</button>`;
      h += `<div class="block"><h3>${t('m_reservations')}</h3>${res.length ? res.map(r => `<div class="kv"><span class="k">${r.code}${r.userId === 'me' ? ' · Aino K.' : ''}</span><span class="v"><span class="badge ${stTone(r.status)}">${t(stKey(r.status))}</span></span></div>`).join('') : `<p class="small muted">${t('m_no_reservations')}</p>`}</div>`;
      if (!gone) {
        h += `<div class="pair mt-3"><button class="btn secondary" data-action="mEdit" data-arg="${o.id}">${icon('edit')}${t('m_edit')}</button><button class="btn secondary" data-action="mStop" data-arg="${o.id}" ${o.reservationsOpen ? '' : 'disabled'}>${t('m_stop')}</button></div>`;
        if (!o.reservationsOpen) h += C.disabledWhy(t('m_stopped'));
        else h += `<p class="xs muted mt-2">${t('m_stop_s')}</p>`;
        h += `<button class="btn danger block mt-3" data-action="mCancelAll" data-arg="${o.id}" ${open.length ? '' : 'disabled'}>${t('m_cancel_all')}</button>${open.length ? '' : C.disabledWhy(t('m_scan_none'))}`;
      }
    }
    return h + `</div></div></div>`;
  };
  const stKey = (s) => ({ confirmed: 'st_confirmed', collected: 'st_collected', cancelled_user: 'st_cancelled_user', cancelled_merchant: 'st_cancelled_merchant', not_received: 'st_not_received', expired: 'st_expired' }[s]);
  const stTone = (s) => ({ collected: 'ok', cancelled_merchant: 'danger', not_received: 'warn', confirmed: 'outline' }[s] || 'ended');

  // ---------------- Store tab ----------------
  MV.storeTab = () => {
    const st = me();
    let h = `<div class="scroll" data-skey="m-store">${MV.header()}<div class="view-pad"><div class="block" style="margin-top:12px"><div style="display:flex;gap:12px;align-items:center">${C.avatar(st, 'lg')}<div><div class="h2">${esc(st.name)}</div><span class="badge ok mt-2">${icon('shield')}${t('m_verified')}</span></div></div><div class="mt-3"><div class="kv"><span class="k">${t('address')}</span><span class="v">${esc(st.address)}</span></div><div class="kv"><span class="k">${t('m_hours')}</span><span class="v">${t('m_hours_v')}</span></div><div class="kv"><span class="k">${t('m_staff')}</span><span class="v">${t('m_staff_v')}</span></div></div></div>`;
    h += `<div class="section-title"><h2 class="h3">${t('m_store_public')}</h2></div><p class="small muted">${t('m_store_public_s')}</p>${C.ratingBlock(st)}`;
    h += `<button class="btn secondary block mt-4" data-action="mViewAs">${t('m_view_as')}</button>`;
    return h + `<div style="height:24px"></div></div></div>`;
  };

  // ---------------- Camera (simulated) ----------------
  MV.camera = () => { const c = S().camera; return `<div class="camera" role="dialog" aria-label="${t('m_camera_t')}"><div class="vf">${FTG.art(c.art, 'cam')}<div class="frame"></div><span class="lab">${t('m_camera_sim')}</span>${c.flash ? '<div class="flash"></div>' : ''}</div><div style="padding:12px 20px 0"><div class="bold">${t('m_camera_t')}</div><div class="small" style="opacity:.75">${t('m_camera_s')}</div></div><div class="cam-bar"><button class="btn sm" style="background:rgba(255,255,255,.14);color:#fff" data-action="mCamClose">${t('cancel')}</button><button class="shutter" data-action="mShutter" aria-label="${t('m_take_photo')}"></button><span style="width:76px"></span></div></div>`; };

  // ---------------- Sheets ----------------
  MV.sheets = {
    scan: (sh) => {
      const s = S(), open = s.reservations.filter(r => r.offerId === sh.id && r.status === 'confirmed');
      return C.sheet(t('m_scan_t'), `<div style="height:150px;border-radius:16px;background:#0e0a16;position:relative;display:grid;place-items:center;color:#fff"><div style="width:110px;height:110px;border:3px solid var(--saffron-500);border-radius:14px"></div><span class="badge outline" style="position:absolute;top:10px;left:10px">${t('simulated')}</span></div><p class="small muted mt-3">${t('m_scan_s')}</p>${open.length ? `<div class="list" style="border:1px solid var(--ink-100)">${open.map(r => `<button class="row-item" data-action="mScanCode" data-arg="${r.id}">${icon('qr')}<span class="grow t">${r.code}${r.userId === 'me' ? ' · Aino K.' : ''}</span><span class="badge outline">${t('st_confirmed')}</span></button>`).join('')}</div>` : C.callout('info', 'info', t('m_scan_none'))}`);
    },
    edit: (sh) => {
      const o = FTG.offer(sh.id), reserved = o.qtyTotal - o.qtyLeft;
      return C.sheet(t('m_edit_t'), `<div class="field"><span class="lbl">${t('m_bags')}</span><div class="stepper"><button data-action="mEditQty" data-arg="-1" aria-label="-1">${icon('minus')}</button><span class="val">${sh.qty}</span><button data-action="mEditQty" data-arg="1" aria-label="+1">${icon('plus')}</button></div>${sh.qty <= reserved ? C.disabledWhy(t('m_edit_min', { n: reserved })) : ''}</div><div class="field"><label for="ee">${t('m_end')}</label><input id="ee" class="input" type="time" value="${sh.end}" data-input="mEditEnd"></div><div class="btns"><button class="btn primary block" data-action="mEditSave">${t('m_save')}</button></div>`);
    },
    cancelAll: (sh) => {
      const n = S().reservations.filter(r => r.offerId === sh.id && r.status === 'confirmed').length;
      return C.sheet(t('m_cancel_t'), `<p class="muted small">${t('m_cancel_s')}</p><div class="field"><span class="lbl">${t('m_cancel_reason')}</span><div class="list" style="border:1px solid var(--ink-100)">${[['mc_out'], ['mc_closed'], ['mc_other']].map(([k]) => `<button class="row-item" data-action="mCancelReason" data-arg="${k}" role="radio" aria-checked="${sh.reason === k}"><span class="grow t">${t(k)}</span>${sh.reason === k ? `<span style="color:var(--berry-600)">${icon('check')}</span>` : ''}</button>`).join('')}</div></div><div class="btns"><button class="btn danger-solid block" data-action="mCancelDo" ${sh.reason ? '' : 'disabled'}>${t('m_cancel_do', { n })}</button>${sh.reason ? '' : C.disabledWhy(FTG.lang ? 'Choose a reason first.' : 'Valitse ensin syy.')}</div>`);
    },
    extend: (sh) => C.sheet(t('m_extend_t'), `<button class="check ${sh.ok ? 'on' : ''}" style="width:100%" data-action="mExtendOk" role="checkbox" aria-checked="${!!sh.ok}"><span class="box">${icon('check')}</span>${t('m_extend_confirm')}</button><div class="btns"><button class="btn primary block" data-action="mExtendDo" ${sh.ok ? '' : 'disabled'}>${t('m_extend')}</button>${sh.ok ? '' : C.disabledWhy(t('m_extend_confirm'))}</div>`),
  };

  // ---------------- Actions ----------------
  MA.mNewDraft = (arg) => {
    const s = S(), tpl = arg === 'tplR' ? FTG.TEMPLATES.reserved : arg === 'tplW' ? FTG.TEMPLATES.walkin : null;
    const mode = tpl ? tpl.mode : arg;
    const nowT = fmt(Math.ceil((s.now + 5) / 5) * 5);
    s.draft = {
      mode, fromTemplate: !!tpl, startedAt: Date.now(),
      qty: tpl && tpl.qty || 5, categories: tpl ? tpl.categories.slice() : [], description: tpl && tpl.description || '', what: tpl && tpl.what || '',
      start: tpl ? tpl.start : nowT, end: tpl ? tpl.end : fmt(Math.ceil((s.now + 80) / 5) * 5),
      photo: tpl && tpl.photo && mode === 'RESERVED' ? Object.assign({}, tpl.photo) : null, // walk-in photo is never reused
    };
    if (mode === 'WALK_IN') s.draft.start = fmt(Math.floor(s.now / 5) * 5); // walk-in: available right away
  };
  MA.mDiscard = () => { S().draft = null; };
  MA.mQty = (d) => { const x = S().draft; x.qty = Math.max(1, Math.min(50, x.qty + +d)); };
  MA.mCat = (c) => { const d = S().draft; d.categories = d.categories.includes(c) ? d.categories.filter(x => x !== c) : d.categories.concat(c); };
  MA.mTakePhoto = () => { const s = S(); s.camera = { art: s.draft.mode === 'WALK_IN' ? 'bananas' : 'groceries' }; };
  MA.mCamClose = () => { S().camera = null; };
  MA.mShutter = () => {
    const s = S(); s.camera.flash = true;
    setTimeout(() => { s.draft.photo = { kind: 'current', art: s.camera.art, at: s.now }; s.camera = null; FTG.render(); }, 380);
  };
  MA.mExample = () => { S().draft.photo = { kind: 'example', art: 'groceries' }; };
  MA.mRemovePhoto = () => { S().draft.photo = null; };
  MA.mPublish = () => {
    const s = S(), d = s.draft; if (validate(d).length) return;
    const o = MV.draftOffer(d);
    const secs = Math.max(1, Math.round((Date.now() - d.startedAt) / 1000));
    s.draft = null; s.published = { id: o.id, secs };
    FTG.publish(o);
    FTG.emit(d.mode === 'WALK_IN' ? 'walkinPublished' : 'published');
    FTG.log(`Pihlaja julkaisi: ${d.mode === 'WALK_IN' ? 'ilmaisjako' : d.qty + ' kassia'} (${secs} s)`, `Pihlaja published: ${d.mode === 'WALK_IN' ? 'walk-in' : d.qty + ' bags'} (${secs} s)`);
  };
  MA.mAnother = () => { S().published = null; };
  MA.mGoManage = (id) => { const s = S(); s.published = null; s.mTab = 'manage'; s.stack = [{ view: 'mOffer', id }]; };
  MA.mOpen = (id) => { S().stack.push({ view: 'mOffer', id }); };
  MA.mScan = (id) => { S().sheet = { type: 'scan', id }; };
  MA.mScanCode = (rid) => {
    const s = S(), r = s.reservations.find(x => x.id === rid); r.status = 'collected';
    const st = FTG.store(FTG.offer(r.offerId).storeId); st.rel.ok += 1;
    if (r.userId === 'me') { s.impact += 1; FTG.emit('collected'); }
    s.sheet = null; FTG.toast(t('m_scan_ok', { c: r.code }));
  };
  MA.mEdit = (id) => { const o = FTG.offer(id); S().sheet = { type: 'edit', id, qty: o.qtyTotal, end: fmt(o.end) }; };
  MA.mEditQty = (d) => { const sh = S().sheet, o = FTG.offer(sh.id), min = o.qtyTotal - o.qtyLeft; sh.qty = Math.max(Math.max(1, min), Math.min(50, sh.qty + +d)); };
  MA.mEditSave = () => { const s = S(), sh = s.sheet, o = FTG.offer(sh.id); const reserved = o.qtyTotal - o.qtyLeft; o.qtyTotal = sh.qty; o.qtyLeft = sh.qty - reserved; o.end = C.parseT(sh.end); s.sheet = null; FTG.toast(t('m_saved')); };
  MA.mStop = (id) => { FTG.offer(id).reservationsOpen = false; FTG.toast(t('m_stopped')); };
  MA.mCancelAll = (id) => { S().sheet = { type: 'cancelAll', id, reason: null }; };
  MA.mCancelReason = (k) => { S().sheet.reason = k; };
  MA.mCancelDo = () => {
    const s = S(), sh = s.sheet, o = FTG.offer(sh.id), st = FTG.store(o.storeId);
    const open = s.reservations.filter(r => r.offerId === o.id && r.status === 'confirmed');
    open.forEach(r => { r.status = 'cancelled_merchant'; r.reasonKey = sh.reason; });
    o.status = 'ended'; s.sheet = null;
    FTG.toast(t('m_cancelled', { n: open.length }));
    FTG.log(`${st.name} perui ${open.length} varausta (${t(sh.reason)}) → kerääjille peruutusilmoitus`, `${st.name} cancelled ${open.length} reservations → cancellation alerts sent`);
    if (open.some(r => r.userId === 'me')) { FTG.emit('merchantCancelled'); setTimeout(() => FTG.showPush({ kind: 'cancel', title: t('push_cancel_t'), body: t('push_cancel_s', { store: st.name, r: t(sh.reason).toLowerCase() }) }), 600); }
  };
  MA.mAllGone = (id) => { const s = S(), o = FTG.offer(id); o.status = 'closed'; o.closedAt = s.now; o.reports.push({ lvl: 'NONE', at: s.now, by: 'merchant', merchant: true }); FTG.toast(t('m_closed_toast')); FTG.emit('merchantClosed'); FTG.log(`${FTG.store(o.storeId).name}: kauppa merkitsi ”Kaikki loppu” → ilmaisjako suljettu`, `${FTG.store(o.storeId).name}: shop marked “All gone” → giveaway closed`); };
  MA.mStillFood = (id) => { const s = S(); FTG.offer(id).reports.push({ lvl: 'LOW', at: s.now, by: 'merchant', merchant: true }); FTG.toast(t('m_still_food_toast')); };
  MA.mExtend = (id) => { S().sheet = { type: 'extend', id, ok: false }; };
  MA.mExtendOk = () => { const sh = S().sheet; sh.ok = !sh.ok; };
  MA.mExtendDo = () => { const s = S(), o = FTG.offer(s.sheet.id); o.expiresAt = Math.max(o.expiresAt, s.now) + 30; o.end = Math.max(o.end, o.expiresAt); s.sheet = null; FTG.toast(t('m_extended')); };
  MA.mViewAs = () => { const s = S(); s.role = 'collector'; s.stack = [{ view: 'store', id: FTG.MERCHANT_STORE_ID }]; };

  MI.mWhat = (v) => { S().draft.what = v; return true; };
  MI.mDesc = (v) => { S().draft.description = v; return true; };
  MI.mStart = (v) => { if (v) S().draft.start = v; return true; };
  MI.mEnd = (v) => { if (v) S().draft.end = v; return true; };
  MI.mEditEnd = (v) => { if (v) S().sheet.end = v; return false; };
})();

</script>
  <script>
/* Free To Go — demo control panel (NOT part of the app). Drives scenarios and simulated events. */
(function () {
  const C = FTG.C, icon = FTG.icon, esc = C.esc, fmt = C.fmt;
  const DA = FTG.DA = {};
  const S = () => FTG.state();
  const L = (fi, en) => FTG.lang ? en : fi;

  const ACTIONS = {
    pubKaneli: [['Kauppahallin Marjapuoti julkaisee 5 kassia', 'Kauppahallin Marjapuoti publishes 5 bags'], () => simPublish('kaneli', { categories: ['produce'], qty: 5, start: 17 * 60, end: 18 * 60 + 30, art: 'bread', desc: 'Mansikoita ja karhunvatukoita.' })],
    pubPihlaja: [['Lähikauppa Pihlaja julkaisee 4 kassia', 'Lähikauppa Pihlaja publishes 4 bags'], () => simPublish('pihlaja', { categories: ['produce', 'dairy'], qty: 4, start: 17 * 60 + 30, end: 19 * 60, art: 'groceries' })],
    pubKumo: [['Sienitori Kuusi (6,8 km) julkaisee', 'Sienitori Kuusi (6.8 km) publishes'], () => simPublish('kumo', { categories: ['produce'], qty: 3, start: 19 * 60, end: 20 * 60, art: 'sushi' })],
    pubHarju: [['Sitruskioski Harju, Jyväskylä julkaisee', 'Sitruskioski Harju, Jyväskylä publishes'], () => simPublish('harju', { categories: ['produce'], qty: 4, start: 17 * 60 + 30, end: 18 * 60 + 30, art: 'pastry' })],
    othersReserve: [['Muut varaavat loput Pihlajan kassit', 'Others reserve the remaining Pihlaja bags'], othersReserve],
    otherNone: [['Toinen kerääjä: Kaikki loppu', 'Another collector: All gone'], () => otherReport('u71')],
    otherNone2: [['Kolmas kerääjä: Kaikki loppu', 'A third collector: All gone'], () => otherReport('u72')],
    staleAlert: [['Avaa vanha ilmoitus (päättynyt tarjous)', 'Open an old alert (ended offer)'], staleAlert],
    race: [['Seuraava varaus häviää kilpailun', 'Next reservation loses the race'], () => { S().demo.race = !S().demo.race; FTG.log(S().demo.race ? 'Kilpailu päällä: seuraava varaus epäonnistuu' : 'Kilpailu pois', S().demo.race ? 'Race on: next reservation fails' : 'Race off'); }],
    clock30: [['+30 min', '+30 min'], () => FTG.advance(30)],
    clockNight: [['Kello 22:30 (hiljainen aika)', 'Set clock 22:30 (quiet hours)'], () => FTG.advance(0, 22 * 60 + 30)],
  };

  function simPublish(storeId, p) {
    const s = S();
    if (p.start <= s.now) { p.start = Math.ceil((s.now + 10) / 5) * 5; p.end = Math.max(p.end, p.start + 60); }
    const o = FTG.makeOffer({ storeId, distributionMode: 'RESERVED', categories: p.categories, qtyTotal: p.qty, qtyLeft: p.qty, start: p.start, end: p.end, publishedAt: s.now, photo: { kind: 'current', art: p.art, at: s.now }, description: p.desc || '' });
    FTG.publish(o);
  }
  function othersReserve() {
    const s = S(), o = s.offers.find(x => x.storeId === 'pihlaja' && x.distributionMode === 'RESERVED' && FTG.offerState(x) === 'active');
    if (!o) { FTG.log('Ei aktiivista Pihlajan kassitarjousta – julkaise ensin', 'No active Pihlaja bag offer – publish first'); return; }
    while (o.qtyLeft > 0) { o.qtyLeft--; s.reservations.push({ id: FTG.nextId('r'), offerId: o.id, userId: 'u' + Math.floor(Math.random() * 90 + 10), code: FTG.code(), status: 'confirmed', createdAt: s.now }); }
    FTG.emit('soldOut'); FTG.log('Pihlaja: kaikki kassit varattu → loppuunvarattu', 'Pihlaja: all bags reserved → fully reserved');
  }
  function otherReport(user) {
    const s = S();
    const o = s.offers.filter(x => x.distributionMode === 'WALK_IN' && !FTG.isGone(FTG.offerState(x)))[0];
    if (!o) { FTG.log('Ei aktiivista ilmaisjakoa', 'No active walk-in giveaway'); return; }
    o.reports = o.reports.filter(r => r.by !== user); o.reports.push({ lvl: 'NONE', at: s.now, by: user });
    const st = FTG.walkSignal(o).state;
    if (st === 'possiblyGone' || st === 'review') FTG.emit('possiblyGone');
    FTG.log(st === 'review' ? `${FTG.store(o.storeId).name}: 2 itsenäistä ”Kaikki loppu” → tarkistettavana, kauppaa pyydetty vahvistamaan (ei suljettu automaattisesti)` : `${FTG.store(o.storeId).name}: 1 vahvistamaton ”Kaikki loppu” → mahdollisesti loppu (ei suljettu)`, st === 'review' ? `${FTG.store(o.storeId).name}: 2 independent “All gone” → under review, shop asked to confirm (not auto-closed)` : `${FTG.store(o.storeId).name}: 1 unverified “All gone” → possibly gone (not closed)`);
  }
  function staleAlert() {
    const s = S();
    const o = FTG.makeOffer({ storeId: 'kaneli', distributionMode: 'RESERVED', categories: ['produce'], qtyTotal: 5, qtyLeft: 2, start: s.now - 120, end: s.now - 30, publishedAt: s.now - 180, photo: { kind: 'current', art: 'bread', at: s.now - 182 } });
    s.offers.push(o);
    FTG.showPush({ kind: 'offer', stale: true, offerId: o.id, title: FTG.t('push_new_bags_t', { store: 'Kauppahallin Marjapuoti', n: 5 }), body: L('Saapunut 3 h sitten', 'Arrived 3 h ago') });
  }

  DA.dScenario = (id) => { FTG.reset(id); };
  DA.dAct = (k) => { ACTIONS[k][1](); };
  DA.dClock = (n) => { FTG.advance(+n); };
  DA.dWidth = (w) => { document.documentElement.style.setProperty('--device-w', w + 'px'); S().demo.width = +w; };
  DA.dTheme = (id) => FTG.setTheme(id);
  DA.dLang = (i) => { FTG.lang = +i; S().lang = +i; };
  DA.dRole = () => FTG.A.switchRole();
  DA.dOpen = () => document.getElementById('demo').classList.add('open');
  DA.dClose = () => document.getElementById('demo').classList.remove('open');

  FTG.V.demo = () => {
    const s = S(), sc = FTG.SCENARIOS[s.demo.scenario];
    let h = `<button class="d demo-close" data-action="dClose">${L('Sulje', 'Close')}</button><h1>Free To Go</h1><p>${L('Stage One · klikattava HTML-mallinnus. Ei taustajärjestelmää, ei oikeaa varastoa, ei push-viestejä.', 'Stage One · clickable HTML mockup. No backend, no real stock, no real push.')}</p>`;
    h += `<div class="notice">${L('Kaikki tässä on simuloitua demodataa. Kuvat ovat piirrettyjä kuvituksia, eivät kauppojen kuvia.', 'Everything here is simulated demo data. Pictures are drawn illustrations, not shop photos.')}</div>`;
    h += `<h2>${L('Skenaariot', 'Scenarios')}</h2><div class="scen">${Object.entries(FTG.SCENARIOS).map(([id, x]) => `<button class="d ${s.demo.scenario === id ? 'on' : ''}" data-action="dScenario" data-arg="${id}"><b>${x.title[FTG.lang]}</b>${x.sub[FTG.lang]}</button>`).join('')}</div>`;
    h += `<ol class="steps">${sc.steps.map(st => `<li class="${s.demo.done.includes(st[2]) ? 'done' : ''}">${st[FTG.lang]}</li>`).join('')}</ol>`;
    const acts = (sc.actions || []).concat(sc.actions && sc.actions.includes('race') ? [] : []);
    if (acts.length) h += `<h2>${L('Simuloi tapahtuma', 'Simulate an event')}</h2><div class="row">${acts.map(k => `<button class="d ${k === 'race' && s.demo.race ? 'on' : ''}" data-action="dAct" data-arg="${k}">${ACTIONS[k][0][FTG.lang]}</button>`).join('')}</div>`;
    h += `<h2>${L('Muut simulaatiot', 'More simulations')}</h2><div class="row">${['pubKaneli', 'pubPihlaja', 'pubKumo', 'pubHarju', 'otherNone', 'staleAlert', 'race'].filter(k => !(sc.actions || []).includes(k)).map(k => `<button class="d ${k === 'race' && s.demo.race ? 'on' : ''}" data-action="dAct" data-arg="${k}">${ACTIONS[k][0][FTG.lang]}</button>`).join('')}</div>`;
    h += `<h2>${L('Demoaika', 'Demo clock')} · ${fmt(s.now)}</h2><div class="row"><button class="d" data-action="dClock" data-arg="10">+10 min</button><button class="d" data-action="dClock" data-arg="30">+30 min</button><button class="d" data-action="dClock" data-arg="60">+60 min</button><button class="d" data-action="dAct" data-arg="clockNight">22:30</button></div>`;
    h += `<h2>${L('Näkymä', 'View')}</h2><div class="row"><button class="d" data-action="dRole">${s.role === 'merchant' ? L('Vaihda kerääjäksi', 'Switch to collector') : L('Vaihda kauppiaaksi', 'Switch to merchant')}</button><button class="d ${!FTG.lang ? 'on' : ''}" data-action="dLang" data-arg="0">Suomi</button><button class="d ${FTG.lang ? 'on' : ''}" data-action="dLang" data-arg="1">English</button></div><div class="row" style="margin-top:6px">${Object.entries(FTG.theme.THEMES).map(([id, th]) => `<button class="d ${FTG.theme.current === id ? 'on' : ''}" data-action="dTheme" data-arg="${id}"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${th.primary};margin-right:6px"></span>${L('Teema', 'Theme')} ${id}</button>`).join('')}</div><div class="row" style="margin-top:6px">${[360, 390, 430].map(w => `<button class="d ${(s.demo.width || 390) === w ? 'on' : ''}" data-action="dWidth" data-arg="${w}">${w}px</button>`).join('')}</div>`;
    h += `<h2>${L('Ilmoitus- ja tapahtumaloki', 'Notification & event log')}</h2><div class="log" data-empty="—">${s.demo.log.map(l => `<div><b>${fmt(l.at)}</b> ${esc(FTG.lang ? l.en : l.fi)}</div>`).join('')}</div>`;
    h += `<p style="margin-top:14px" class="xs">${L('Pois päältä ja piilotettu: maksut, muut toimialat, kohdennettu kanava, kampanjat ja etuoikeus. Katso docs/design.', 'Off and hidden: payments, other verticals, targeted channel, campaigns and priority. See docs/design.')}</p>`;
    return h;
  };
})();

</script>
  <script>FTG.boot();</script>
</body>
